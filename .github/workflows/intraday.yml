name: Wake 장중 시세

on:
  schedule:
    - cron: "*/20 0-6 * * 1-5"     # 평일 09:00~15:40 (한국시간) 약 20분마다
    - cron: "50 6 * * 1-5"         # 15:50 장 마감 종가
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intraday
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: pip install -r requirements-site.txt
      - name: 시세 스냅샷
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python tools/intraday.py
      - name: live 브랜치에 저장
        run: |
          cp live/quick.json /tmp/quick.json
          git config user.name "wake-bot"
          git config user.email "wake-bot@users.noreply.github.com"
          git checkout --orphan live
          git rm -rf --cached . > /dev/null
          cp /tmp/quick.json quick.json
          git add -f quick.json
          git commit -m "장중 시세 $(TZ=Asia/Seoul date '+%F %H:%M')"
          git push -f origin live
