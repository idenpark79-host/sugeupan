name: Wake 데이터 갱신·배포

on:
  schedule:
    - cron: "41 9 * * 1-5"      # 평일 18:41 (한국시간) — 투자자별 매매동향 확정 후
  workflow_dispatch:             # Actions 화면에서 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: pip install -r requirements-site.txt
      - name: 데이터 생성
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          if [ -z "$KRX_ID" ]; then
            echo "KRX_ID 시크릿이 없어 미리보기용 가상 데이터로 생성합니다."
            python site_build.py --demo
          else
            python site_build.py
          fi
      - name: 추천 성적 기록 저장
        run: |
          if [ -f track/picks.csv ]; then
            git config user.name "wake-bot"
            git config user.email "wake-bot@users.noreply.github.com"
            git add track/picks.csv track/model.json 2>/dev/null || git add track/picks.csv
            git commit -m "추천 성적 기록 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
            git push || echo "기록 저장 실패"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
