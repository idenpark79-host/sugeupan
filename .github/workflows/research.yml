name: Wake 연구 (추천 규칙 검증)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: pip install -r requirements-site.txt
      - name: 실데이터 검증
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python tools/research_live.py
      - name: 결과 저장 (research-results 브랜치)
        if: always()
        run: |
          git config user.name "wake-bot"
          git config user.email "wake-bot@users.noreply.github.com"
          git checkout --orphan research-results
          git rm -rf --cached . > /dev/null
          git add -f research/*.json || true
          git commit -m "연구 결과 $(TZ=Asia/Seoul date '+%F %H:%M')" || exit 0
          git push -f origin research-results
