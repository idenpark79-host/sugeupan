<title>Wake</title>
<meta name="description" content="Wake 투자정보 — 추천종목(단기·스윙), 기술적 분석, 투자자별 매매동향, 업종 맵, 전략 검증">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Wake — 증권사 리서치 스타일. 네이비·회색 바탕, 빨강은 상승·파랑은 하락에만.
   레이아웃: 네이비 메뉴 레일 | 상단 검색 + 본문. 860px 이하 하단 탭바 */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --sunk:#F5F6F8; --hover:#F2F5F9; --line:#E1E5EA; --line-strong:#C6CCD5;
  --ink:#1B2230; --ink-2:#3B4555; --muted:#6B7483; --faint:#A1A8B3;
  --accent:#163A70; --accent-ink:#FFFFFF; --accent-soft:#E8EEF7; --accent-2:#C4A15A;
  --rail:#0F2547; --rail-ink:#C9D3E3; --rail-mute:#7F8EA8; --rail-on:#1A3561; --rail-line:#1F3863;
  --up:#D92B33; --down:#1A5FD0; --up-soft:#FDEDEE; --down-soft:#EAF1FC; --up-soft2:#F2A7AB; --down-soft2:#9DBCEB; --map0:#D9DEE5;
  --c-ind:#9AA2AE; --c-frg:#C7802A; --c-ins:#163A70; --c-pen:#7B5AA6;
  --s1:#163A70; --s2:#C7802A; --s3:#7B5AA6; --s4:#6B7483;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --serif:var(--font);
  --r:4px; --top:56px; --rail-w:216px; --g:28px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1117; --surface:#151A22; --sunk:#1B212B; --hover:#1A202A; --line:#262D38; --line-strong:#38414E;
  --ink:#E3E7ED; --ink-2:#B9C1CC; --muted:#8892A0; --faint:#5A6370;
  --accent:#86A9E3; --accent-ink:#0D1117; --accent-soft:#1B2740; --accent-2:#C4A15A;
  --rail:#0A1220; --rail-ink:#C3CCDA; --rail-mute:#6F7C91; --rail-on:#16233A; --rail-line:#18233A;
  --up:#FF4D55; --down:#4C8DFF; --up-soft:#2C1517; --down-soft:#132239; --up-soft2:#8A3A3F; --down-soft2:#2F4F86; --map0:#28303B;
  --c-ind:#7E8794; --c-frg:#E3A04F; --c-ins:#86A9E3; --c-pen:#B08AD8;
  --s1:#86A9E3; --s2:#E3A04F; --s3:#B08AD8; --s4:#A3ACB8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#151A22; --sunk:#1B212B; --hover:#1A202A; --line:#262D38; --line-strong:#38414E;
  --ink:#E3E7ED; --ink-2:#B9C1CC; --muted:#8892A0; --faint:#5A6370;
  --accent:#86A9E3; --accent-ink:#0D1117; --accent-soft:#1B2740; --accent-2:#C4A15A;
  --rail:#0A1220; --rail-ink:#C3CCDA; --rail-mute:#6F7C91; --rail-on:#16233A; --rail-line:#18233A;
  --up:#FF4D55; --down:#4C8DFF; --up-soft:#2C1517; --down-soft:#132239; --up-soft2:#8A3A3F; --down-soft2:#2F4F86; --map0:#28303B;
  --c-ind:#7E8794; --c-frg:#E3A04F; --c-ins:#86A9E3; --c-pen:#B08AD8;
  --s1:#86A9E3; --s2:#E3A04F; --s3:#B08AD8; --s4:#A3ACB8; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.1px}
.num{font-variant-numeric:tabular-nums;letter-spacing:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;letter-spacing:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
svg text{font-family:var(--font)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.ico{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 셸: 레일 | 본문 */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow:auto;scrollbar-width:none;background:var(--rail);color:var(--rail-ink);padding:0 12px 16px;display:flex;flex-direction:column}
.rail::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:9px;height:var(--top);padding:0 8px;white-space:nowrap;flex:none}
.brand .mk{width:24px;height:24px;flex:none}
.brand .wm{font-weight:700;font-size:19px;letter-spacing:-.4px;line-height:1}
.brand .sub{font-size:11.5px;font-weight:500;color:var(--rail-mute);letter-spacing:0;margin-left:2px}
.rail .grp{font-size:11.5px;color:var(--rail-mute);font-weight:500;padding:18px 10px 6px}
.rail a.nv{position:relative;display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:3px;color:var(--rail-ink);font-weight:500;font-size:14px;white-space:nowrap}
.rail a.nv .ico{color:var(--rail-mute)}
.rail a.nv:hover{background:var(--rail-on)}
.rail a.nv[aria-current="page"]{background:var(--rail-on);color:#fff;font-weight:700}
.rail a.nv[aria-current="page"] .ico{color:var(--accent-2)}
.rail a.nv[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--accent-2)}
.badge{margin-left:auto;font-size:11px;font-weight:700;line-height:18px;min-width:22px;text-align:center;background:var(--rail-line);color:var(--rail-ink);border-radius:2px;padding:0 5px}
.rail .rf{margin-top:auto;padding:16px 10px 0;font-size:11.5px;color:var(--rail-mute);line-height:1.7;border-top:1px solid var(--rail-line)}
.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;height:var(--top);display:flex;align-items:center;gap:16px;padding:0 var(--g);background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand{display:none;padding:0;height:auto}
.search{position:relative;flex:0 1 420px;min-width:0}
.search .ico{position:absolute;left:11px;top:9px;width:17px;height:17px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:35px;border-radius:3px;border:1px solid var(--line-strong);background:var(--surface);padding:0 40px 0 35px;font-size:13.5px}
.search input:focus{border-color:var(--accent);outline:none}
.search input::placeholder{color:var(--muted)}
.search kbd{position:absolute;right:8px;top:8px;font:500 11px/17px var(--font);color:var(--muted);border:1px solid var(--line-strong);border-radius:2px;padding:0 5px}
.drop{position:absolute;top:40px;left:0;right:0;z-index:50;background:var(--surface);border:1px solid var(--line-strong);border-radius:3px;max-height:min(460px,64vh);overflow:auto;padding:3px}
.drop .dh{font-size:11.5px;color:var(--muted);padding:8px 10px 4px}
.drop button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:2px;text-align:left}
.drop button:hover,.drop button.on{background:var(--sunk)}
.drop .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop .n small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px}
.drop .p{font-size:12.5px;text-align:right}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.asof{font-size:12px;color:var(--muted);white-space:nowrap}
.ib{width:34px;height:34px;border-radius:3px;display:grid;place-items:center;color:var(--ink-2)}
.ib:hover{background:var(--sunk)}
main{min-width:0;padding:24px var(--g) 80px;flex:1}
.wrap{max-width:1240px;margin:0 auto}

/* 공통 */
.banner{font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent-2);padding:8px 12px;margin-bottom:16px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-.6px;line-height:1.25}
.ph p{margin-top:4px;color:var(--muted);font-size:12.5px;max-width:680px}
.ph2{font-size:16px;font-weight:700;letter-spacing:-.4px;margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line-strong)}
.mt{margin-top:16px} .mt2{margin-top:28px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g2.w{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g2.al{align-items:start}
.seg.off{opacity:.35;pointer-events:none}
.tabs2{padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none} .tabs2::-webkit-scrollbar{display:none}
.tabs2 .hz{border-bottom:0;flex-wrap:nowrap;width:auto} .tabs2 .hz button{font-size:13.5px;font-weight:600;padding:11px 2px 9px;margin:0 18px -1px 0;white-space:nowrap;border:0;border-bottom:2px solid transparent;border-radius:0;background:none}
.tabs2 .hz button[aria-pressed="true"]{border:0;border-bottom:2px solid var(--accent);background:none;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;flex-wrap:wrap;min-height:44px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:14.5px;letter-spacing:-.4px;font-weight:700}
.card-h h2 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px;letter-spacing:0}
.card-b{padding:14px 16px 16px}
.card-b.flush{padding:0}
.more{font-size:12.5px;color:var(--accent);font-weight:500}
.more:hover{text-decoration:underline;text-underline-offset:3px}
.lbl{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.75}
.note b{color:var(--ink-2);font-weight:500}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{padding:4px 12px;font-size:12.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;border-left:1px solid var(--line);line-height:20px}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg button small{font-size:11px;font-weight:500;opacity:.8;margin-left:3px}
.hz{display:flex;gap:0;border-bottom:1px solid var(--line-strong);width:100%}
.hz button{font-size:15px;font-weight:700;color:var(--muted);padding:8px 18px 9px;border:1px solid transparent;border-bottom:0;margin-bottom:-1px;border-radius:3px 3px 0 0;letter-spacing:-.4px}
.hz button[aria-pressed="true"]{color:var(--ink);background:var(--surface);border-color:var(--line-strong);border-top:2px solid var(--accent)}
.hz button small{font-size:12px;font-weight:400;margin-left:6px;color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 0 9px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);font-weight:700}
.rtabs{display:flex;flex-wrap:wrap;gap:0;padding:12px 16px;border-bottom:1px solid var(--line)}
.rtabs button{border:1px solid var(--line-strong);margin:0 -1px -1px 0;padding:4px 12px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.rtabs button:hover{background:var(--hover)}
.rtabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;position:relative}
.btn{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 13px;border-radius:3px;border:1px solid var(--line-strong);font-weight:500;font-size:13px;background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.in{height:34px;border-radius:3px;border:1px solid var(--line-strong);background:var(--surface);padding:0 10px;min-width:0;width:100%}
.in:focus{border-color:var(--accent);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);border-radius:2px;padding:1px 8px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.chip.acc{border-color:var(--accent);color:var(--accent);font-weight:700}
button.chip:hover{background:var(--hover)}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:2px;padding:0 5px;line-height:17px;vertical-align:1px;margin-left:6px;border:1px solid var(--accent);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
.skel{height:160px;border-radius:var(--r);background:var(--sunk)}
.scroll{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:2px;display:inline-block}
.star{width:28px;height:28px;display:grid;place-items:center;border-radius:3px;color:var(--faint)}
.star:hover{background:var(--sunk)}
.star .ico{width:16px;height:16px}
.star.on{color:var(--accent-2)}
.star.on .ico{fill:currentColor}

/* 표 */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:8px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap;background:var(--sunk)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .l{text-align:left}
.tbl .c{text-align:center}
.tbl tr[data-go]{cursor:pointer}
.tbl tr[data-go]:hover td{background:var(--hover)}
.tbl th:first-child,.tbl td:first-child{padding-left:16px}
.tbl th:last-child,.tbl td:last-child{padding-right:16px}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:hover{color:var(--ink)}
.tbl th.on{color:var(--accent);font-weight:700}
.tbl .rk{color:var(--muted);width:30px;text-align:right}
.nm{display:block;min-width:0}
.nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.nm small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.two b{display:block;font-weight:500}
.two small{display:block;font-size:11.5px;font-weight:400}
.bar{position:relative;height:6px;background:var(--sunk);overflow:hidden;min-width:70px}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--accent)}
.st{display:inline-block;font-size:11.5px;font-weight:500;border-radius:2px;padding:0 7px;border:1px solid var(--line-strong);color:var(--ink-2);line-height:19px}
.st.win{border-color:var(--up);color:var(--up)}
.st.loss{border-color:var(--down);color:var(--down)}

/* 목록 */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row .rk{color:var(--muted);font-size:12px;text-align:right}
.row .v{text-align:right}
.row .v b{display:block;font-weight:700;font-size:13px}
.row .v small{display:block;font-size:11.5px;font-weight:400}

/* 추천종목 — 리서치 카드 */
.pks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pk{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:var(--r);display:flex;flex-direction:column;cursor:pointer;min-width:0;text-align:left}
.pk:hover{border-color:var(--line-strong);border-top-color:var(--accent)}
.pk-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 16px 10px}
.pk-n{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.pk-n .rk{font-weight:700;color:var(--muted);font-size:13px;min-width:16px}
.pk-n b{font-weight:700;font-size:17px;letter-spacing:-.6px}
.pk-n small{color:var(--muted);font-size:11.5px}
.pk-px{text-align:right;white-space:nowrap}
.pk-px b{display:block;font-size:16px;font-weight:700}
.pk-px small{font-size:12px;font-weight:500}
.op{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1px;border-radius:2px;padding:0 6px;line-height:18px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
.op.S{background:var(--accent);color:var(--accent-ink)}
.op.B,.op.C{border-color:var(--line-strong);color:var(--ink-2)}
.gr{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;border-radius:2px;font-weight:700;font-size:11.5px;background:var(--accent);color:var(--accent-ink)}
.gr.A{background:var(--accent-soft);color:var(--accent)}
.gr.B,.gr.C{background:var(--sunk);color:var(--ink-2)}
.ty{font-size:11.5px;font-weight:500;color:var(--ink-2);border:1px solid var(--line-strong);border-radius:2px;padding:0 6px;line-height:18px;white-space:nowrap}
.wake{display:block;width:100%;height:84px}
.pk-c{padding:0 16px}
.pk-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:8px}
.pk-nums>div{padding:8px 12px 9px;border-left:1px solid var(--line);min-width:0}
.pk-nums>div:first-child{border-left:0;padding-left:16px}
.pk-nums .k{font-size:11.5px;color:var(--muted)}
.pk-nums .v{font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.35}
.pk-nums .s{font-size:11.5px;color:var(--muted)}
.pk-why{display:grid;grid-template-columns:74px minmax(0,1fr);gap:6px 10px;padding:10px 16px 13px;font-size:13px;line-height:1.6}
.pk-why dt{font-size:12px;color:var(--muted);padding-top:1px}
.pk-why dd{margin:0;color:var(--ink-2);min-width:0}
.pk-why dd.ps{color:var(--ink);font-weight:500}
.tone{display:inline-block;font-size:11px;font-weight:700;border-radius:2px;padding:0 5px;line-height:17px;margin-right:6px;vertical-align:1px;border:1px solid}
.tone.t1{color:var(--up);border-color:var(--up)} .tone.t-1{color:var(--down);border-color:var(--down)} .tone.t0{color:var(--ink-2);border-color:var(--line-strong)}
.regime{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:9px 14px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);font-size:13px;margin-bottom:14px}
.regime b{font-weight:700}
.regime.off{border-left-color:var(--down)}
.sty{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:0 0 14px}
.sty .note{flex:1 1 220px;margin:0}
.summ{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);background:var(--surface);margin:0 0 16px}
.summ>*{display:flex;flex-direction:column-reverse;justify-content:flex-end;padding:11px 16px;border-left:1px solid var(--line);min-width:0}
.summ>*:first-child{border-left:0}
.summ>a:hover{background:var(--hover)}
.summ .v{font-size:21px;font-weight:700;letter-spacing:-.4px;line-height:1.3}
.summ .k{font-size:12px;color:var(--muted)}

/* 기술적 분석 */
.view{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px}
.view .hd{font-size:17px;font-weight:700;letter-spacing:-.5px;line-height:1.5}
.view .sm{margin:10px 0 0;display:flex;flex-direction:column;gap:5px;color:var(--ink-2);font-size:13.5px;line-height:1.65}
.view .sm p{padding-left:11px;position:relative}
.view .sm p::before{content:"";position:absolute;left:0;top:.75em;width:4px;height:1px;background:var(--muted)}
.scn{margin-top:14px;border-top:1px solid var(--line)}
.scn>div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.6}
.scn b{font-weight:700;font-size:12px}
.tarows{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.55}
.tarows tr.grp td{padding:12px 0 5px;font-weight:700;color:var(--ink);font-size:12.5px;border-bottom:1px solid var(--line-strong)}
.tarows th{width:84px;text-align:left;font-weight:500;color:var(--muted);padding:7px 10px 7px 0;vertical-align:top;border-bottom:1px solid var(--line);white-space:nowrap}
.tarows td{padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
.tarows tr:last-child th,.tarows tr:last-child td{border-bottom:0}
.aisc{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin-bottom:12px}
.aisc>div{padding:9px 12px;border-left:1px solid var(--line)}
.aisc>div:first-child{border-left:0}
.aisc .k{font-size:11.5px;color:var(--muted)} .aisc .v{font-weight:700;font-size:16px}

/* 홈 */
.idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.idx .card{padding:12px 16px 10px;display:flex;flex-direction:column;min-width:0}
.idx .n{font-size:12.5px;color:var(--ink-2);font-weight:700}
.idx .v{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:1px}
.idx .c{font-size:12px;font-weight:500}
.idx svg{width:100%;height:32px;margin-top:6px;display:block}
.brief{display:flex;flex-direction:column}
.brief .r{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.65}
.brief .r:first-child{padding-top:0}
.brief .r:last-child{border-bottom:0}
.brief .k{font-size:12px;color:var(--muted);font-weight:500;padding-top:1px}
.brief b{font-weight:700}
.flowrow{display:grid;grid-template-columns:58px minmax(0,1fr) 88px;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.flowrow:last-child{border-bottom:0}
.flowrow .who{font-weight:500;font-size:13px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.dv{position:relative;height:18px}
.dv .ax{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-strong)}
.dv .b{position:absolute;top:4px;bottom:4px}
.flowrow .val{text-align:right;font-weight:700;font-size:14px}
.flowrow .sub2{grid-column:2/4;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:11.5px;color:var(--muted);margin-top:-6px}
.hb{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;align-items:center;gap:10px;padding:4px 0;font-size:12.5px;width:100%;text-align:left}
button.hb:hover .t{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.hb .t{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .v{text-align:right;font-weight:700}
.bt-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.big{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1.15}
.kv2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;font-size:13px}
.kv2 span{color:var(--muted)}
.kv2 b{float:right;font-weight:700}
.dist svg{width:100%;height:auto;display:block}
.bmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.bbar{display:flex;height:8px;overflow:hidden;margin-top:8px;background:var(--sunk)}
.bbar i{display:block;height:100%}
.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.wt{display:flex;flex-direction:column;gap:2px;padding:11px 16px;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.wt:nth-child(4n){border-right:0}
.wt:hover{background:var(--hover)}
.wt .n{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt b{font-weight:700}
.wgrid .wt:nth-last-child(-n+4){border-bottom:0}

/* 지도 */
.tm{position:relative;width:100%;height:640px;overflow:hidden}
.tm svg{display:block}
.tm rect.s{cursor:pointer}
.tm text{pointer-events:none}
.mapbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink)}
.crumb button{color:var(--accent);font-weight:500}
.scale{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.scale .g{display:flex;height:10px;overflow:hidden}
.scale .g i{width:18px;display:block}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:3px;padding:9px 11px;font-size:12px;min-width:180px}
.tip b{font-size:13px}
.tip .r2{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.tip .r2 span:last-child{color:var(--ink);font-weight:500}

/* 지표 칸 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);background:var(--surface)}
.kpi{padding:12px 16px;min-width:0;border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:700;letter-spacing:-.5px;margin-top:2px;line-height:1.3}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
a.kpi:hover{background:var(--hover)}
.lead{font-size:14px;line-height:1.75;color:var(--ink-2)}
.lead b{color:var(--ink)}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.rules>div{padding:11px 16px;border-right:1px solid var(--line);font-size:12.5px;color:var(--ink-2);line-height:1.6}
.rules>div:last-child{border-right:0}
.rules b{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
.chart{height:300px;width:100%}
.chart.s{height:150px}
.hm{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;min-width:600px}
.hm col.y0{width:44px} .hm col.ya{width:66px} .hm col.yk{width:58px}
.hm th{font-weight:500;color:var(--muted);padding:6px 2px;text-align:center;white-space:nowrap}
.hm td{padding:6px 2px;text-align:center;border:1px solid var(--surface);white-space:nowrap}
.hm td.y{font-weight:700}
.hm th:first-child,.hm td:first-child{text-align:left;padding-left:2px;font-weight:500;color:var(--ink-2)}
.prob{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.prob b{font-size:15px;letter-spacing:-.3px;min-width:58px;text-align:right}

/* 조건검색 */
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 24px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) 78px 10px 78px;gap:6px;align-items:center;font-size:12.5px}
.fr span{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr i{font-style:normal;color:var(--muted);text-align:center}
.fr .in{height:30px;padding:0 8px;text-align:right}
.fr.on span{color:var(--accent);font-weight:700}
.ftop{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* 비교 */
.cmpc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cmpc .chip{display:inline-flex;align-items:center;gap:7px;padding:3px 6px 3px 10px;font-size:12.5px;font-weight:500}
.cmpc .chip button{color:var(--muted);font-size:16px;line-height:1;padding:0 3px}
.minisearch{position:relative;width:220px}
.minisearch .drop{top:38px}

/* 종목 */
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.sh .t{font-size:24px;font-weight:700;letter-spacing:-.7px}
.sh .t small{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px;letter-spacing:0}
.sh .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.sh .px{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.15;margin-top:6px}
.sh .ch{font-size:15px;font-weight:500}
.rets{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.rets>div{padding:10px 16px;border-right:1px solid var(--line)}
.rets>div:last-child{border-right:0}
.rets .k{font-size:11.5px;color:var(--muted)} .rets .v{font-weight:700;font-size:15px;margin-top:1px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.kv>div{padding:10px 16px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.kv>div:nth-child(4n){border-right:0}
.kv>div:nth-last-child(-n+4){border-bottom:0}
.kv .k{font-size:11.5px;color:var(--muted)} .kv .v{font-weight:500;font-size:14px;margin-top:1px}
.range{padding:11px 16px 13px;border-top:1px solid var(--line)}
.range .rl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.range .rl b{color:var(--ink);font-weight:500}
.range .rb{position:relative;height:5px;background:linear-gradient(90deg,var(--down),var(--map0),var(--up));opacity:.75;margin-top:8px}
.range .rb i{position:absolute;top:-5px;width:3px;height:15px;background:var(--ink);transform:translateX(-50%)}
.pickbox{border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:var(--r);background:var(--surface)}
.pickbox .pb-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.pickbox .pb-h b{font-size:14.5px;font-weight:700;letter-spacing:-.4px}
.pickbox .pk-nums{margin-top:0;border-top:0}
.pickbox .pk-why{padding-top:10px}
.ind{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.ind .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ind .grp b{font-size:12px;color:var(--muted);font-weight:500;min-width:40px}
.tog{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:2px;padding:2px 9px 2px 7px;font-size:12px;cursor:pointer;user-select:none;color:var(--muted);background:var(--surface)}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog .sw{width:9px;height:9px;border:1.5px solid currentColor;flex:none}
.tog:has(input:checked){color:var(--ink);border-color:var(--line-strong);font-weight:500}
.tog:has(input:checked) .sw{background:var(--c,var(--ink));border-color:var(--c,var(--ink))}
.tog:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.pane{position:relative;border-top:1px solid var(--line)}
.pane .ptag{display:block;font-size:11px;color:var(--muted);padding:5px 2px 1px}
.mainc{height:440px;position:relative}
.subc{height:120px}
.vpl{position:absolute;top:0;bottom:0;right:70px;width:15%;pointer-events:none;z-index:2}
.vpl i{position:absolute;right:0;background:var(--accent);opacity:.13}
.vpl i.hv{opacity:.26}
.vpl i.poc{background:var(--accent-2);opacity:.45}

/* 하단 탭바 · 시트 · 토스트 */
.tabbar{display:none}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(8,12,20,.5);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet .in2{background:var(--surface);width:100%;border-radius:8px 8px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet .grp{font-size:12px;color:var(--muted);font-weight:500;padding:12px 4px 6px}
.sheet .gl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sheet .gl a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px;border-radius:3px;font-size:12px;color:var(--ink-2);border:1px solid var(--line)}
.sheet .gl a[aria-current="page"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--surface);padding:9px 15px;border-radius:3px;font-size:13px;font-weight:500}
.toast[hidden]{display:none}

footer{color:var(--muted);font-size:11.5px;margin-top:44px;line-height:1.75;border-top:1px solid var(--line-strong);padding-top:14px}
footer a{text-decoration:underline;text-underline-offset:2px}

@media (max-width:1280px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1180px){
  :root{--rail-w:68px;--g:22px}
  .rail{padding:0 8px 14px}
  .brand{justify-content:center;padding:0}
  .rail .brand .wm,.rail .brand .sub{display:none}
  .rail .grp{font-size:0;padding:6px 0;margin:6px 6px;border-top:1px solid var(--rail-line)}
  .rail a.nv{justify-content:center;padding:0;height:44px}
  .rail a.nv[aria-current="page"]::before{left:-8px}
  .rail a.nv .t,.rail .rf{display:none}
  .rail a.nv .badge{position:absolute;top:3px;right:3px;font-size:10px;line-height:15px;min-width:16px;padding:0 3px}
  .g2.w{grid-template-columns:minmax(0,1fr)}
  .rules{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rules>div:nth-child(2){border-right:0}
  .rules>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .view{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:980px){
  .pks{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  :root{--g:14px;--top:52px}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .top{gap:10px;padding:0 8px 0 14px}
  .top .brand{display:flex}
  .top .brand .mk{width:22px;height:22px}
  .top .brand .wm{font-size:18px}
  .top .brand .sub{display:none}
  .asof,.search kbd{display:none}
  .search{flex:1}
  .search input{padding-right:12px}
  main{padding:16px var(--g) calc(96px + env(safe-area-inset-bottom,0px))}
  .ph h1{font-size:20px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .idx{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .idx .card:first-child:nth-last-child(2n+1){grid-column:1/-1}
  .kpis,.summ{grid-template-columns:repeat(2,minmax(0,1fr))}
  .summ>*:nth-child(odd){border-left:0}
  .summ>*:nth-child(n+3){border-top:1px solid var(--line)}
  .kpi .v{font-size:19px}
  .summ .v{font-size:19px}
  .wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wt{padding:10px 14px}
  .wt:nth-child(4n){border-right:1px solid var(--line)}
  .wt:nth-child(2n){border-right:0}
  .wgrid .wt:nth-last-child(-n+4){border-bottom:1px solid var(--line)}
  .wgrid .wt:nth-last-child(-n+2){border-bottom:0}
  .filters{grid-template-columns:minmax(0,1fr)}
  .rets{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rets>div:nth-child(3){border-right:0}
  .rets>div:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv>div:nth-child(4n){border-right:1px solid var(--line)}
  .kv>div:nth-child(2n){border-right:0}
  .kv>div:nth-last-child(-n+4){border-bottom:1px solid var(--line)}
  .kv>div:nth-last-child(-n+2){border-bottom:0}
  .rules{grid-template-columns:minmax(0,1fr)}
  .rules>div{border-right:0!important;border-bottom:1px solid var(--line)}
  .rules>div:last-child{border-bottom:0}
  .sh .px{font-size:28px}
  .sh .btn{height:30px;padding:0 10px;font-size:12.5px}
  .tm{height:520px}
  .mainc{height:340px}
  .chart{height:250px}
  .bt-hero{grid-template-columns:minmax(0,1fr)}
  .bt-hero>div:last-child{text-align:left!important}
  .minisearch{width:100%}
  .tbl{font-size:12.5px}
  .tbl th,.tbl td{padding-left:8px;padding-right:8px}
  .tbl th:first-child,.tbl td:first-child{padding-left:14px}
  .tbl th:last-child,.tbl td:last-child{padding-right:14px}
  .card-h{padding:9px 14px}
  .card-b{padding:12px 14px 14px}
  .row{padding:9px 14px}
  .tabs{padding:0 14px}
  .rtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:10px 14px}
  .hide-m{display:none}
  .hz button{padding:8px 14px 9px;font-size:14.5px}
  .pk-h{padding:11px 14px 9px}
  .pk-c{padding:0 14px}
  .pk-nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pk-nums>div:nth-child(3){border-left:0;padding-left:14px}
  .pk-nums>div:first-child{padding-left:14px}
  .pk-nums>div:nth-child(n+3){border-top:1px solid var(--line)}
  .pk-nums .v{font-size:16px}
  .pk-why{padding:10px 14px 12px;grid-template-columns:70px minmax(0,1fr)}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 8px;font-size:11px;color:var(--muted);font-weight:500}
  .tabbar .ico{width:21px;height:21px}
  .tabbar [aria-current="page"]{color:var(--accent);font-weight:700}
}
@media (max-width:420px){
  .idx .v{font-size:19px}
  .flowrow{grid-template-columns:62px minmax(0,1fr) 76px;gap:8px}
  .flowrow .who{font-size:12.5px;gap:5px}
  .hb{grid-template-columns:78px minmax(0,1fr) 58px}
}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .15s ease both}@keyframes f{from{opacity:.5}to{opacity:1}}}

/* 투자의견 표기 · 섹터 */
.opt{display:inline-flex;align-items:center;height:20px;padding:0 7px;font-size:11.5px;font-weight:700;border-radius:2px;border:1px solid;white-space:nowrap;vertical-align:1px;letter-spacing:0}
.opt.big{height:30px;padding:0 12px;font-size:15px}
.opt.l2{background:var(--up);border-color:var(--up);color:#fff}
.opt.l1{color:var(--up);border-color:var(--up);background:var(--surface)}
.opt.l0{color:var(--muted);border-color:var(--line-strong);background:var(--surface)}
.opt.lm1{color:var(--down);border-color:var(--down);background:var(--surface)}
.opt.lm2{background:var(--down);border-color:var(--down);color:#fff}
.dist{display:inline-flex;width:96px;height:10px;background:var(--sunk);vertical-align:middle;overflow:hidden}
.dist i{display:block;height:100%}
.clg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);padding:2px 0 8px;min-height:6px}

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const S = { list: [], by: {}, detail: {}, charts: [], sectors: [], pick: {} };
const INV = ["외국인", "기관합계", "연기금", "개인"];
const INV_VAR = { "개인": "--c-ind", "외국인": "--c-frg", "기관합계": "--c-ins", "연기금": "--c-pen" };
const INV_KEY = { "외국인": "frg", "기관합계": "inst", "연기금": "pen" };
const LBL = i => ({ "기관합계": "기관" }[i] || i);
const st = {
  homeMk: "KOSPI", homeSec: "pct", mapMk: "ALL", mapBy: "pct", mapN: 200, mapSec: null,
  rankTab: "up", rankMk: "ALL", rankN: 50, fMk: "KOSPI", fInv: "외국인", fN: "5", fDays: 60,
  aiSrc: "all", aiS: "base", btS: "base", trTab: "open", btE: null, btP: 10, btLog: 25, sPer: 120, cmpPer: 126, scrSort: ["cap", -1], scrN: 100
};

/* ── 유틸 ── */
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function n(v, d) { if (v == null || isNaN(v)) return "-"; if (d == null) d = Math.abs(v) >= 1000 ? 0 : 2; return (+v).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d }); }
const sg = (v, d) => v == null ? "-" : (v > 0 ? "+" : "") + n(v, d);
const p1 = v => v == null ? "-" : (+v).toFixed(1);
const pct = (v, d = 2) => { if (v == null || isNaN(v)) return "-"; const x = +(+v).toFixed(d); return `${x > 0 ? "+" : ""}${(x === 0 ? 0 : x).toFixed(d)}%`; };
const pctf = (v, d = 1) => v == null || isNaN(v) ? "-" : pct(v * 100, d);
function eok(v, sign = true) {
  if (v == null || isNaN(v)) return "-";
  const a = Math.abs(v), p = sign && v > 0 ? "+" : v < 0 ? "-" : "";
  if (a >= 10000) return p + (a / 10000).toLocaleString("ko-KR", { maximumFractionDigits: a >= 100000 ? 1 : 2 }) + "조";
  if (a < 10 && a > 0) return p + a.toLocaleString("ko-KR", { maximumFractionDigits: 1 }) + "억";
  return p + Math.round(a).toLocaleString("ko-KR") + "억";
}
function won(v) { // 원 단위 금액 → 억/만
  if (v == null || isNaN(v)) return "-";
  const a = Math.abs(v), s = v < 0 ? "-" : "";
  if (a >= 1e8) return s + (a / 1e8).toLocaleString("ko-KR", { maximumFractionDigits: 2 }) + "억 원";
  if (a >= 1e4) return s + Math.round(a / 1e4).toLocaleString("ko-KR") + "만 원";
  return s + Math.round(a).toLocaleString("ko-KR") + "원";
}
const dt = s => s ? s.replaceAll("-", ".") : "";
const eul = w => { const c = String(w).charCodeAt(String(w).length - 1) - 0xAC00; return c >= 0 && c < 11172 && c % 28 ? "을" : "를"; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("wk_" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wk_" + k, JSON.stringify(v)); } catch { } }
};
async function j(p) { const r = await fetch(p, { cache: "no-cache" }); if (!r.ok) throw new Error(p); return r.json(); }
function killCharts() { S.charts.forEach(c => { try { c.remove(); } catch { } }); S.charts = []; }
const mkName = m => m === "P" || m === "KOSPI" ? "코스피" : "코스닥";
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
async function detail(code) {
  if (S.detail[code]) return S.detail[code];
  const s = S.by[code]; if (!s || !(s.has & 1)) return null;
  try { return S.detail[code] = await j(`data/s/${code}.json`); } catch { return null; }
}
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }

/* 아이콘 */
const IC = {
  edu: '<path d="M3.5 5.5c3-1.3 5.8-1.3 8.5.5v14c-2.7-1.8-5.5-1.8-8.5-.5z"/><path d="M20.5 5.5c-3-1.3-5.8-1.3-8.5.5v14c2.7-1.8 5.5-1.8 8.5-.5z"/>',
  home: '<path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/>',
  map: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M11 3v18M11 13h10M3 9h8M16 13v8"/>',
  rank: '<path d="M5 20v-8M12 20V5M19 20v-5"/>',
  flows: '<circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15.8 14.3A4.6 4.6 0 0 1 21 19"/>',
  ai: '<path d="M11 3.5l1.9 5.1 5.1 1.9-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>',
  bt: '<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5v4h4"/><path d="M12 7.5V12l3 2"/>',
  screen: '<path d="M4 5h16l-6.2 7.6V19l-3.6 1.8v-8.2z"/>',
  cmp: '<rect x="3.5" y="4" width="7" height="16" rx="1.5"/><rect x="13.5" y="4" width="7" height="16" rx="1.5"/>',
  watch: '<path d="M12 3.6l2.6 5.3 5.8.9-4.2 4.1 1 5.8L12 17l-5.2 2.7 1-5.8-4.2-4.1 5.8-.9z"/>',
  pf: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12h8.5"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  auto: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>',
  sector: '<path d="M12 3.5v8.5h8.5A8.5 8.5 0 1 1 12 3.5z"/><path d="M15 3.8A8.5 8.5 0 0 1 20.2 9H15z"/>',
  op: '<path d="M4 19.5h16"/><path d="M6.5 16V11M11 16V7M15.5 16v-3M20 16V5"/>',
  pat: '<path d="M7 3.5v4M7 16.5v4M17 3.5v6M17 18.5v2"/><rect x="4.5" y="7.5" width="5" height="9" rx="1"/><rect x="14.5" y="9.5" width="5" height="9" rx="1"/>'
};
const ico = k => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

/* 메뉴 */
const NAV = [
  ["국내증시", [["home", "시장 개요"], ["sector", "섹터·테마"], ["map", "업종 맵"], ["rank", "순위 분석"], ["flows", "투자자 동향"]]],
  ["투자정보", [["op", "투자의견"], ["ai", "추천종목"], ["pat", "기술적 신호"], ["edu", "차트 공부"], ["bt", "전략 검증"], ["screen", "조건검색"], ["cmp", "종목 비교"]]],
  ["MY", [["watch", "관심종목"], ["pf", "보유종목"]]]
];
const ICON_OF = { sector: "sector", op: "op", home: "home", map: "map", rank: "rank", flows: "flows", ai: "ai", bt: "bt", pat: "pat", edu: "edu", screen: "screen", cmp: "cmp", watch: "watch", pf: "pf" };
const BRAND = `<a class="brand" href="#home" aria-label="Wake 홈"><svg class="mk" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="3" fill="var(--accent-2)"/><path d="M5 7.5l2.6 9 2.6-7 1.8 5 1.8-5 2.6 7 2.6-9" fill="none" stroke="#0F2547" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span class="wm">Wake</span><span class="sub">투자정보</span></a>`;
const recH = h => S.rec?.ok ? S.rec.h?.[String(h)] : null;
function badgeOf(r) {
  if (r === "ai" && recH(20)?.picks?.length) return recH(20).picks.length;
  if (r === "watch") { const k = alertHits().length; return k ? k : null; }
  if (r === "cmp") { const k = store.get("cmp", []).length; return k || null; }
  return null;
}
function drawNav() {
  $("#rail").innerHTML = BRAND + NAV.map(([g, items]) => `<div class="grp">${g}</div>` + items.map(([r, l]) => {
    const b = badgeOf(r);
    return `<a class="nv" href="#${r}" data-r="${r}" title="${l}">${ico(ICON_OF[r])}<span class="t">${l}</span>${b ? `<span class="badge num">${b}</span>` : ""}</a>`;
  }).join("")).join("") + `<div class="rf" id="railFoot"></div>`;
  $("#tabbar").innerHTML = [["home", "시장"], ["ai", "추천종목"], ["flows", "투자자"], ["watch", "관심"]].map(([r, l]) =>
    `<a href="#${r}" data-r="${r}">${ico(ICON_OF[r])}<span>${l}</span></a>`).join("") + `<button id="moreBtn" aria-label="전체 메뉴">${ico("menu")}<span>전체</span></button>`;
  $("#moreBtn").onclick = openSheet;
  if (S.meta) $("#railFoot").innerHTML = `${dt(S.meta.asof)} 종가 기준<br>매 영업일 18:40 갱신`;
  markNav();
}
function markNav() {
  const r = (location.hash.slice(1) || "home").split("-")[0];
  $$("[data-r]").forEach(a => a.setAttribute("aria-current", a.dataset.r === r ? "page" : "false"));
  const more = $("#moreBtn"); if (more) more.setAttribute("aria-current", ["home", "ai", "flows", "watch", "stock"].includes(r) ? "false" : "page");
}
function openSheet() {
  const th = store.get("theme", "auto");
  $("#sheetIn").innerHTML = NAV.map(([g, items]) => `<div class="grp">${g}</div><div class="gl">${items.map(([r, l]) =>
    `<a href="#${r}" data-r="${r}">${ico(ICON_OF[r])}${l}</a>`).join("")}</div>`).join("") +
    `<div class="grp">화면</div>${seg("sth", [["auto", "시스템"], ["light", "라이트"], ["dark", "다크"]], th)}
     <p class="note" style="margin-top:12px">${S.meta ? `${dt(S.meta.asof)} 종가 기준 · 매 영업일 18:40 갱신` : ""}</p>`;
  onSeg($("#sheetIn"), "sth", v => { applyTheme(v); closeSheet(); route(); });
  markNav();
  $("#sheet").hidden = false;
}
function closeSheet() { $("#sheet").hidden = true; }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet" || e.target.closest("a")) closeSheet(); });

/* 테마 */
const THEMES = { auto: ["auto", "시스템 설정"], light: ["sun", "라이트 모드"], dark: ["moon", "다크 모드"] };
function applyTheme(m) {
  const r = document.documentElement;
  if (m === "light" || m === "dark") r.dataset.theme = m; else delete r.dataset.theme;
  store.set("theme", m);
  $("#themeBtn").innerHTML = ico(THEMES[m][0]);
  $("#themeBtn").title = THEMES[m][1] + " (누르면 변경)";
  requestAnimationFrame(() => { const m2 = document.querySelector('meta[name="theme-color"]'); if (m2) m2.content = css("--surface"); });
}
$("#themeBtn").onclick = () => { const o = ["auto", "light", "dark"], c = store.get("theme", "auto"); applyTheme(o[(o.indexOf(c) + 1) % 3]); route(); };
applyTheme(store.get("theme", "auto"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (store.get("theme", "auto") === "auto") route(); });

/* 초성 검색 */
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const cho = s => [...s].map(ch => { const c = ch.charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch; }).join("");
const isCho = s => /^[ㄱ-ㅎ]+$/.test(s);
function findStocks(q, k = 12) {
  const t = q.trim().toLowerCase().replace(/\s/g, "");
  if (!t) return [];
  const ch = isCho(t);
  return S.list.map(s => {
    const nm = s.lname, cs = s.cho;
    const sc = nm.startsWith(t) ? 3 : nm.includes(t) ? 2 : ch && cs.startsWith(t) ? 2.5 : ch && cs.includes(t) ? 1.5 : /^\d+$/.test(t) && s.code.startsWith(t) ? 1 : 0;
    return [sc, s];
  }).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0] || b[1].cap - a[1].cap).slice(0, k).map(x => x[1]);
}
/* 검색 상자 (상단·비교·포트폴리오 공용) */
function attachSearch(input, box, onPick, opt = {}) {
  let sel = 0, res = [];
  const item = (s, i) => `<button class="${i === sel ? "on" : ""}" data-c="${s.code}" type="button"><span class="n">${esc(s.name)}<small>${mkName(s.mkt)} ${s.code}</small></span>
      <span class="p num">${n(s.price)} <span class="${cls(s.pct)}">${pct(s.pct)}</span></span></button>`;
  const draw = () => {
    const t = input.value.trim();

function squarify(items, x, y, w, h) {
  const out = [], total = items.reduce((a, b) => a + b.v, 0);
  if (!total || w <= 0 || h <= 0) return out;
  const scale = w * h / total;
  let rest = items.filter(it => it.v > 0).map(it => ({ it, a: it.v * scale }));
  const worst = (row, s) => { let sm = 0, mx = 0, mn = Infinity; for (const r of row) { sm += r.a; mx = Math.max(mx, r.a); mn = Math.min(mn, r.a); } return Math.max(s * s * mx / (sm * sm), sm * sm / (s * s * mn)); };

    for (; i < rest.length; i++) { const r2 = row.concat(rest[i]), w2 = worst(r2, short); if (w2 > best) break; row = r2; best = w2; }
    const sm = row.reduce((a, b) => a + b.a, 0);
    if (w >= h) { const cw = sm / h; let cy = y; row.forEach(r => { const rh = r.a / cw; out.push({ it: r.it, x, y: cy, w: cw, h: rh }); cy += rh; }); x += cw; w -= cw; }
    else { const ch = sm / w; let cx = x; row.forEach(r => { const rw = r.a / ch; out.push({ it: r.it, x: cx, y, w: rw, h: ch }); cx += rw; }); y += ch; h -= ch; }
    rest = rest.slice(row.length);
  }
  return out;
}

function wakeSvg(closes, price, target, stop, H, w) {
  const h = 84, pt = 14, pb = 14, past = closes.slice(-60), xn = Math.round(w * 0.7);
  const lo = Math.min(...past, stop), hi = Math.max(...past, target);
  const y = v => pt + (hi - v) / ((hi - lo) || 1) * (h - pt - pb);
  const x = i => i / (past.length - 1) * xn;
  const d = past.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join("");
  const yt = y(target), ys = y(stop), yp = y(price);
  return `<svg class="wake" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="최근 60일 종가와 목표가·손절가">
    <rect x="${xn}" y="${yt}" width="${w - xn}" height="${Math.max(yp - yt, 0)}" fill="var(--up)" opacity=".07"/>
    <rect x="${xn}" y="${yp}" width="${w - xn}" height="${Math.max(ys - yp, 0)}" fill="var(--down)" opacity=".06"/>
    <line x1="${xn}" x2="${w}" y1="${yt}" y2="${yt}" stroke="var(--up)" stroke-dasharray="3 3"/>
    <line x1="${xn}" x2="${w}" y1="${ys}" y2="${ys}" stroke="var(--down)" stroke-dasharray="3 3"/>
    <line x1="${xn}" x2="${xn}" y1="2" y2="${h - 2}" stroke="var(--line)"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${xn}" cy="${yp}" r="3" fill="var(--accent)"/>
    <text x="${w - 2}" y="${yt - 4}" text-anchor="end" font-size="10.5" fill="var(--up)" font-weight="500">목표 ${n(target)}</text>
    <text x="${w - 2}" y="${ys + 12}" text-anchor="end" font-size="10.5" fill="var(--down)" font-weight="500">손절 ${n(stop)}</text></svg>`;
}

/* 차트 공부 — 기술적 분석 기초 교육 */
const EF = (() => {
  const mk = (cl, w = 1.2) => cl.map((c, i) => { const o = i ? cl[i - 1] : c - 1.5; return [o, Math.max(o, c) + w * (1 + (i * 7 % 3) / 2), Math.min(o, c) - w * (1 + (i * 5 % 3) / 2), c]; });
  const ma = (a, n) => a.map((_, i) => i < n - 1 ? null : a.slice(i - n + 1, i + 1).reduce((x, y) => x + y, 0) / n);
  // 캔들 그림 — 글자는 차트 밖(오른쪽 여백·그림 설명)에만 둔다
  function fig(C, o = {}) {
    const W = 360, R = o.hl ? 66 : 8, VH = o.vol ? 38 : 0, H = (o.h || 170) + VH, ph = (o.h || 170) - 16, n = C.length, bw = (W - R - 8) / n;
    const vs = [...C.flatMap(c => [c[1], c[2]]), ...(o.hl || []).map(x => x[0]), ...(o.ln || []).flatMap(x => x[0]).filter(v => v != null), ...(o.seg || []).flatMap(x => [x[1], x[3]])];
    const lo0 = Math.min(...vs), hi0 = Math.max(...vs), pd = (hi0 - lo0) * .1, lo = lo0 - pd, hi = hi0 + pd;
    const X = i => 4 + bw * (i + .5), Y = p => 8 + (1 - (p - lo) / (hi - lo)) * ph, up = "var(--up)", dn = "var(--down)";
    let g = "";
    (o.zone || []).forEach(([i1, i2, p1, p2, c]) => g += `<rect x="${X(i1) - bw / 2}" y="${Y(p2)}" width="${(i2 - i1 + 1) * bw}" height="${Y(p1) - Y(p2)}" fill="${c}" opacity=".12"/>`);
    (o.hl || []).forEach(([p, lab, c, d]) => g += `<line x1="4" x2="${W - R}" y1="${Y(p)}" y2="${Y(p)}" stroke="${c}" stroke-width="1" ${d ? `stroke-dasharray="4 3"` : ""}/><text x="${W - R + 5}" y="${Y(p) + 4}" fill="${c}" font-size="11">${lab}</text>`);
    C.forEach(([op, hi, lo, cl], i) => { const c = cl >= op ? up : dn, x = X(i), bwi = Math.max(bw * .62, 2);
      g += `<line x1="${x}" x2="${x}" y1="${Y(hi)}" y2="${Y(lo)}" stroke="${c}" stroke-width="1.2"/><rect x="${x - bwi / 2}" y="${Y(Math.max(op, cl))}" width="${bwi}" height="${Math.max(Math.abs(Y(op) - Y(cl)), 1.2)}" fill="${c}"/>`; });
    (o.ln || []).forEach(([a, c, w, d]) => { const pts = a.map((v, i) => v == null ? null : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(" ");
      g += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${w || 1.6}" ${d ? `stroke-dasharray="5 3"` : ""}/>`; });
    (o.seg || []).forEach(([i1, p1, i2, p2, c, d]) => g += `<line x1="${X(i1)}" y1="${Y(p1)}" x2="${X(i2)}" y2="${Y(p2)}" stroke="${c}" stroke-width="1.8" ${d ? `stroke-dasharray="5 3"` : ""}/>`);

    $$("#ind input").forEach(i => i.onchange = () => {

    const tf = st.tf || "d", cur = (st.per ||= {})[tf] || DEFP[tf];

    onSeg($("#spw"), "sp", x => { st.per[tf] = +x; draw(); });

  const draw = () => {

    const O = dly ? d.ohlcv : (tf === "w" ? d.wk : d.mo) || aggTF(d.ohlcv, tf);
    const X = calc(O), LG = [];
    const lg = (c, label, price) => LG.push(`<span><i style="background:${c}"></i>${label}${price != null ? ` <b class="num">${n(price)}</b>` : ""}</span>`);

      if (k === "sar") line(X.sar, c, 1, { lineVisible: false, pointMarkersVisible: true, pointMarkersRadius: 1.6, ...na });

    const have = new Set(O.map(r => r[0])), mk = [];
    if (BT && on.has("bt") && dly) {
      const ac = css("--accent");
      BT.t.forEach(t => { if (have.has(t[0])) mk.push({ time: t[0], position: "belowBar", color: ac, shape: "circle", text: "" });
        if (have.has(t[1])) mk.push({ time: t[1], position: "aboveBar", color: t[4] > 0 ? up : dn, shape: "circle", text: "" }); });

    if (TA) {

      }
      const ts = O.map(r => r[0]);
      const seg2 = (a, b) => { const ia = ts.indexOf(a[0]), ib = ts.indexOf(b[0]);          // 봉마다 점을 찍어야 화면 밖 시작점이 축 범위를 늘리지 않음

        if (L.brk && have.has(L.brk)) { mk.push({ time: L.brk, position: L.kind === "dn" ? "belowBar" : "aboveBar", color: col, shape: "circle", text: "" }); lg(col, `${L.kind === "dn" ? "빗각 돌파" : "빗각 이탈"}(점) ${dt(L.brk.slice(5))}`); }

      if (onA2.has("gap") && TA.ov?.gaps) TA.ov.gaps.forEach(([k2, a2, b2]) => { const cg = css("--s4");
        cs.createPriceLine({ price: a2, color: cg, lineWidth: 1, lineStyle: 3, axisLabelVisible: false, title: "" }); lg(cg, `${k2} ${n(a2)}~${n(b2)}`);
        cs.createPriceLine({ price: b2, color: cg, lineWidth: 1, lineStyle: 3, axisLabelVisible: false, title: "" }); });
      if (onA2.has("sig") && d.sigs) {
        const EXTRA = new Set(["period_brk", "fib_bounce", "hi52", "lo52", "box_up", "box_dn", "limit_up", "limit_dn", "ichi_cloud_up", "ichi_cloud_dn"]);
        const from = O.at(-80)?.[0] || "", seen = new Set(), SL = [];          // 최근 80봉 · 가격 구조 신호만 · 하루 한 개
        d.sigs.filter(([t, k2]) => t >= from && have.has(t) && SIGM[k2] && SIGM[k2][1] && (["차트 패턴", "빗각·기준봉"].includes(SIGM[k2][2]) || EXTRA.has(k2)))
          .forEach(([t, k2]) => { if (seen.has(t)) return; seen.add(t); const m2 = SIGM[k2];
            mk.push({ time: t, position: m2[1] < 0 ? "aboveBar" : "belowBar", color: m2[1] > 0 ? up : dn, shape: m2[1] > 0 ? "arrowUp" : "arrowDown", text: "" }); SL.push(`${dt(t.slice(5))} ${m2[0]}`); });
        if (SL.length) lg(css("--ink-2"), "신호(화살표) " + SL.slice(-4).reverse().join(" · "));
      }
      if (onA2.has("base") && TA.base) {
        const B2 = TA.base, cb = css("--s3");
        [[B2.h, "기준봉 고가"], [B2.m, "기준봉 중심"], [B2.o, "기준봉 시가"]].forEach(([p, t]) => cs.createPriceLine({ price: p, color: cb, lineWidth: 1, lineStyle: t === "기준봉 중심" ? 0 : 2, axisLabelVisible: true, title: "" }));
        lg(cb, `기준봉(${dt(B2.d.slice(5))}) 고가 ${n(B2.h)} · 중심 ${n(B2.m)} · 시가 ${n(B2.o)}`);
        if (have.has(B2.d)) mk.push({ time: B2.d, position: "aboveBar", color: cb, shape: "square", text: "" });
      }
      if (onA2.has("fib") && TA.fib) { TA.fib.levels.forEach(([r, p]) => cs.createPriceLine({ price: p, color: css("--s3"), lineWidth: 1, lineStyle: 1, axisLabelVisible: true, title: "" }));
        lg(css("--s3"), "피보나치 " + TA.fib.levels.filter(([r]) => [0.382, 0.5, 0.618].includes(r)).map(([r, p]) => `${(r * 100).toFixed(1)}% ${n(p)}`).join(" · ")); }

    const vpOn = !!(TA?.vp?.bins && onA2.has("vp"));

      if (k === "sto") { base(X.stoK, 80, 20); Ls(X.stoD, org); }

      if (k === "dmi") { Ls(X.pdi, up, 1.2); Ls(X.mdi, dn, 1.2); Ls(X.adx, ink, 1.5); }

    });

    all.forEach(c => c.timeScale().subscribeVisibleLogicalRangeChange(r => { if (lock || !r) return; lock = true; all.forEach(o => o !== c && o.timeScale().setVisibleLogicalRange(r)); lock = false; }));
    const N = O.length, per = Math.min((st.per ||= {})[tf] || DEFP[tf], N), ext = fcOn ? 20 : 0, pad = vpOn ? Math.round((per + ext) * 0.2) : 2;   // 매물대 막대가 최근 봉을 가리지 않게 오른쪽 여백
    mc.timeScale().setVisibleLogicalRange({ from: Math.max(0, N - per), to: N + ext + pad });

  const TABS = [["flow", "매매동향"], ...(d.short ? [["short", "공매도"]] : []), ...(d.view ? [["ta", "기술적 분석"]] : []), ...(d.op ? [["op", "투자의견"]] : []),

    TC = S.charts.slice(n0);
  };
  onSeg(v, "tf", x => { st.tf = x; draw(); });
  draw();

}

boot();
