<title>Wake</title>
<meta name="description" content="Wake — 큰돈의 흐름을 읽다. 시장 지도, 외국인·기관·연기금 매매동향, 조건 검색, 기대 수익률 추천과 과거 성과 백테스트">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 상단바 + 좌측 메뉴(레일) | 본문. 1180px 이하 아이콘 레일, 860px 이하 하단 탭바 */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --sunk:#EFF1F4; --hover:#F6F7F9; --line:#E4E7EC; --line-strong:#CDD2DA;
  --ink:#111827; --ink-2:#394252; --muted:#727B8A; --faint:#A3AAB6;
  --accent:#1C2B4D; --accent-ink:#FFFFFF; --accent-soft:#E9EDF5;
  --up:#E8202F; --down:#1660E8; --map0:#D5DAE1;
  --c-ind:#9AA3B2; --c-frg:#D9822B; --c-ins:#1C2B4D; --c-pen:#1F9D61;
  --s1:#1C2B4D; --s2:#D9822B; --s3:#1F9D61; --s4:#8B5CF6;
  --font:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --r:10px; --top:56px; --rail:228px; --g:28px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0F16; --surface:#121824; --sunk:#192131; --hover:#161D2A; --line:#222A39; --line-strong:#333D50;
  --ink:#E9EDF3; --ink-2:#BAC2CF; --muted:#8A93A3; --faint:#5C6576;
  --accent:#A3B6E2; --accent-ink:#0B0F16; --accent-soft:#1B2537;
  --up:#FF4A57; --down:#4C8DFF; --map0:#283142;
  --c-ind:#7F8899; --c-frg:#F0A04B; --c-ins:#A3B6E2; --c-pen:#3FC283;
  --s1:#A3B6E2; --s2:#F0A04B; --s3:#3FC283; --s4:#B79CFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F16; --surface:#121824; --sunk:#192131; --hover:#161D2A; --line:#222A39; --line-strong:#333D50;
  --ink:#E9EDF3; --ink-2:#BAC2CF; --muted:#8A93A3; --faint:#5C6576;
  --accent:#A3B6E2; --accent-ink:#0B0F16; --accent-soft:#1B2537;
  --up:#FF4A57; --down:#4C8DFF; --map0:#283142;
  --c-ind:#7F8899; --c-frg:#F0A04B; --c-ins:#A3B6E2; --c-pen:#3FC283;
  --s1:#A3B6E2; --s2:#F0A04B; --s3:#3FC283; --s4:#B79CFF; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
svg text{font-family:var(--font)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 상단바 */
.top{position:sticky;top:0;z-index:40;height:var(--top);display:flex;align-items:center;gap:18px;padding-right:20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{width:var(--rail);flex:none;padding-left:24px;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand .wm{font-weight:700;font-size:20px;letter-spacing:-.5px}
.brand small{font-size:11.5px;color:var(--muted)}
.search{position:relative;flex:0 1 480px;min-width:0}
.search .ico{position:absolute;left:11px;top:9px;width:19px;height:19px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);padding:0 44px 0 38px}
.search input:focus{background:var(--surface);border-color:var(--line-strong);outline:none}
.search input::placeholder{color:var(--muted)}
.search kbd{position:absolute;right:9px;top:9px;font:500 11px/18px var(--font);color:var(--muted);border:1px solid var(--line-strong);border-radius:5px;padding:0 6px}
.drop{position:absolute;top:44px;left:0;right:0;z-index:50;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;max-height:min(460px,64vh);overflow:auto;padding:4px}
.drop .dh{font-size:11.5px;color:var(--muted);padding:8px 10px 4px;font-weight:600}
.drop button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:7px;text-align:left}
.drop button:hover,.drop button.on{background:var(--sunk)}
.drop .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop .n small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px}
.drop .p{font-size:12.5px;text-align:right}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.asof{font-size:12px;color:var(--muted);white-space:nowrap}
.ib{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.ib:hover{background:var(--sunk)}

/* 좌측 메뉴 */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:calc(100vh - var(--top))}
.rail{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;scrollbar-width:none;background:var(--surface);border-right:1px solid var(--line);padding:8px 12px 14px;display:flex;flex-direction:column}
.rail .grp{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.4px;padding:16px 12px 6px}
.rail a{position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:14px;white-space:nowrap}
.rail a .ico{color:var(--muted)}
.rail a:hover{background:var(--hover)}
.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.rail a[aria-current="page"] .ico{color:var(--accent)}
.badge{margin-left:auto;font-size:11px;font-weight:700;line-height:18px;min-width:20px;text-align:center;background:var(--sunk);color:var(--ink-2);border-radius:999px;padding:0 6px}
.rail a[aria-current="page"] .badge{background:var(--surface)}
.rail .rf{margin-top:auto;padding:16px 12px 0;font-size:11.5px;color:var(--muted);line-height:1.65}
main{min-width:0;padding:26px var(--g) 90px}
.wrap{max-width:1240px;margin:0 auto}

/* 공통 */
.banner{font-size:12.5px;color:var(--ink-2);background:var(--sunk);border-radius:8px;padding:8px 12px;margin-bottom:16px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:25px;font-weight:700;letter-spacing:-.7px;line-height:1.25}
.ph p{margin-top:5px;color:var(--muted);font-size:13.5px;max-width:760px}
.mt{margin-top:16px} .mt2{margin-top:28px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g2.w{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px 0;flex-wrap:wrap;min-height:44px}
.card-h h2{font-size:15.5px;letter-spacing:-.3px;font-weight:700}
.card-h h2 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px;letter-spacing:0}
.card-b{padding:12px 18px 16px}
.card-b.flush{padding:6px 0 4px}
.more{font-size:12.5px;color:var(--muted);font-weight:500}
.more:hover{color:var(--ink)}
.lbl{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.75}
.note b{color:var(--ink-2);font-weight:600}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.rtabs{display:flex;flex-wrap:wrap;gap:6px;padding:14px 18px;border-bottom:1px solid var(--line)}
.rtabs button{border:1px solid var(--line-strong);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.rtabs button:hover{background:var(--hover)}
.rtabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding:0 18px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:12px 0 11px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:700}
.btn{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line-strong);font-weight:600;font-size:13.5px;background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.in{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 10px;min-width:0;width:100%}
.in:focus{border-color:var(--line-strong);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.chip.acc{border-color:var(--accent);color:var(--accent);font-weight:600}
button.chip:hover{background:var(--hover)}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;line-height:18px;vertical-align:1px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.skel{height:160px;border-radius:var(--r);background:var(--sunk)}
.scroll{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:2px;border-radius:1px;display:inline-block}
.star{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;color:var(--faint)}
.star:hover{background:var(--sunk)}
.star .ico{width:17px;height:17px}
.star.on{color:var(--accent)}
.star.on .ico{fill:currentColor}

/* 표 */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .l{text-align:left}
.tbl .c{text-align:center}
.tbl tr[data-go]{cursor:pointer}
.tbl tr[data-go]:hover td{background:var(--hover)}
.tbl th:first-child,.tbl td:first-child{padding-left:18px}
.tbl th:last-child,.tbl td:last-child{padding-right:18px}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:hover{color:var(--ink)}
.tbl th.on{color:var(--ink);font-weight:700}
.tbl .rk{color:var(--muted);width:30px;text-align:right}
.nm{display:block;min-width:0}
.nm b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.nm small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.two b{display:block;font-weight:600}
.two small{display:block;font-size:11.5px;font-weight:500}
.bar{position:relative;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:70px}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:3px;background:var(--accent)}
.st{display:inline-block;font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;border:1px solid var(--line-strong);color:var(--ink-2)}
.st.win{border-color:transparent;background:var(--up);color:#fff}
.st.loss{border-color:transparent;background:var(--down);color:#fff}

/* 목록 행 */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 18px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row .rk{color:var(--muted);font-size:12px;text-align:right}
.row .v{text-align:right}
.row .v b{display:block;font-weight:700;font-size:13.5px}
.row .v small{display:block;font-size:11.5px;font-weight:500}

/* 홈 */
.idx{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.idx .card{padding:13px 15px 9px;display:flex;flex-direction:column;min-width:0}
.idx .n{font-size:12.5px;color:var(--ink-2);font-weight:600}
.idx .v{font-size:21px;font-weight:700;letter-spacing:-.5px;margin-top:1px}
.idx .c{font-size:12px;font-weight:600}
.idx svg{width:100%;height:32px;margin-top:6px;display:block}
.brief{display:flex;flex-direction:column}
.brief .r{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.65}
.brief .r:first-child{padding-top:2px}
.brief .r:last-child{border-bottom:0}
.brief .k{font-size:12px;color:var(--muted);font-weight:600;padding-top:2px}
.brief b{font-weight:700}
.flowrow{display:grid;grid-template-columns:58px minmax(0,1fr) 88px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.flowrow:last-child{border-bottom:0}
.flowrow .who{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px}
.dv{position:relative;height:20px}
.dv .ax{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-strong)}
.dv .b{position:absolute;top:4px;bottom:4px;border-radius:3px}
.flowrow .val{text-align:right;font-weight:700;font-size:15px}
.flowrow .sub2{grid-column:2/4;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;color:var(--muted);margin-top:-6px}
.hb{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;align-items:center;gap:10px;padding:5px 0;font-size:13px;width:100%;text-align:left}
button.hb:hover .t{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.hb .t{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .v{text-align:right;font-weight:700}
.bt-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.big{font-size:30px;font-weight:700;letter-spacing:-.8px;line-height:1.15}
.kv2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;font-size:13px}
.kv2 span{color:var(--muted)}
.kv2 b{float:right;font-weight:700}
.dist svg{width:100%;height:auto;display:block}
.bmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;margin-top:6px}
.bbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;background:var(--sunk)}
.bbar i{display:block;height:100%}

.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:4px;border-top:1px solid var(--line)}
.wt{display:flex;flex-direction:column;gap:2px;padding:11px 18px;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.wt:nth-child(4n){border-right:0}
.wt:hover{background:var(--hover)}
.wt .n{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt b{font-weight:700}
.wgrid .wt:nth-last-child(-n+4){border-bottom:0}

/* 지도 */
.tm{position:relative;width:100%;height:640px;overflow:hidden;border-radius:0 0 var(--r) var(--r)}
.tm svg{display:block}
.tm rect.s{cursor:pointer}
.tm text{pointer-events:none}
.mapbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink)}
.crumb button{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.scale{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.scale .g{display:flex;height:10px;border-radius:3px;overflow:hidden}
.scale .g i{width:18px;display:block}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;font-size:12.5px;min-width:170px}
.tip b{font-size:13.5px}
.tip .r2{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.tip .r2 span:last-child{color:var(--ink);font-weight:600}

/* AI·백테스트 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.6px;margin-top:2px;line-height:1.3}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
a.kpi:hover{border-color:var(--line-strong)}
.lead{font-size:15px;line-height:1.7;color:var(--ink-2)}
.lead b{color:var(--ink)}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.rules>div{padding:12px 18px;border-right:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.6}
.rules>div:last-child{border-right:0}
.rules b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.chart{height:300px;width:100%}
.chart.s{height:150px}
.hm{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;min-width:600px}
.hm col.y0{width:44px} .hm col.ya{width:66px} .hm col.yk{width:58px}
.hm th{font-weight:500;color:var(--muted);padding:6px 2px;text-align:center;white-space:nowrap}
.hm td{padding:7px 2px;text-align:center;border:2px solid var(--surface);border-radius:4px;white-space:nowrap}
.hm td.y{font-weight:700}
.hm th:first-child,.hm td:first-child{text-align:left;padding-left:2px;font-weight:600;color:var(--ink-2)}
.prob{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.prob b{font-size:16px;letter-spacing:-.3px;min-width:58px;text-align:right}
.why{white-space:normal!important;max-width:280px}
.pickc{display:none}
.pick{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;padding:14px 16px}
.pick .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pick .nm b{font-size:16px;max-width:none}
.pick .px{text-align:right;font-weight:700;font-size:17px}

  let rest = items.filter(it => it.v > 0).map(it => ({ it, a: it.v * scale }));
  const worst = (row, s) => { let sm = 0, mx = 0, mn = Infinity; for (const r of row) { sm += r.a; mx = Math.max(mx, r.a); mn = Math.min(mn, r.a); } return Math.max(s * s * mx / (sm * sm), sm * sm / (s * s * mn)); };

    rest = rest.slice(row.length);
  }

      const label = `${g.k}  ${gv == null ? "" : by === "frg5" ? eok(sum(g.it.map(s => s.frg5 || 0))) : pct(gv, by === "pct" ? 2 : 1)}`;
      const mc = Math.floor((sr.w - 10) / 11.5);
      svg += `<g data-sec="${esc(g.k)}" style="cursor:${st.mapSec ? "default" : "zoom-in"}"><rect x="${sr.x}" y="${sr.y}" width="${sr.w}" height="${hh}" style="fill:var(--surface)"/>
        <text x="${sr.x + 5}" y="${sr.y + 13.5}" font-size="11.5" font-weight="700" style="fill:var(--ink-2)">${esc(label.length > mc ? label.slice(0, Math.max(mc - 1, 1)) + "…" : label)}</text></g>`;
    }
    for (const t of squarify(g.it.map(s => ({ v: s.cap, s })), sr.x + 1, sr.y + hh + 1, sr.w - 2, sr.h - hh - 2)) {
      const s = t.it.s, v = val(s), i = tiles.push(s) - 1;
      svg += `<rect class="s" data-i="${i}" x="${(t.x + .5).toFixed(1)}" y="${(t.y + .5).toFixed(1)}" width="${Math.max(t.w - 1, 0).toFixed(1)}" height="${Math.max(t.h - 1, 0).toFixed(1)}" style="fill:${fill(v)}"/>`;
      let fs = Math.min(24, t.w / (s.name.length * 1.02 + .6), t.h / 2.7);
      let nm = s.name;
      if (fs < 9.5) { fs = Math.min(9.5, t.h / 2.2); const k = Math.floor((t.w - 4) / fs); if (k < 2 || fs < 8) continue; nm = s.name.length > k ? s.name.slice(0, k) : s.name; }
      const cx = t.x + t.w / 2, cy = t.y + t.h / 2, two = t.h > fs * 2.8 && t.w > fs * 3.2;
      svg += `<text x="${cx.toFixed(1)}" y="${(cy + (two ? -fs * .12 : fs * .36)).toFixed(1)}" font-size="${fs.toFixed(1)}" font-weight="600" text-anchor="middle" style="fill:${ink(v)}">${esc(nm)}</text>`;
      if (two) svg += `<text x="${cx.toFixed(1)}" y="${(cy + fs * .98).toFixed(1)}" font-size="${Math.max(9, fs * .7).toFixed(1)}" text-anchor="middle" style="fill:${ink(v)};opacity:.9">${fmt(s, v)}</text>`;
    }
  }
  S.mapTiles = tiles;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="시장 지도">${svg}</svg>`;
  $("#crumb").innerHTML = st.mapSec ? `<button type="button" id="mback">전체 시장</button> / <b>${esc(st.mapSec)}</b> <span class="num">${L.length}종목</span>` : `<b>전체 시장</b> <span class="num">시가총액 상위 ${L.length}종목</span>`;
  if ($("#mback")) $("#mback").onclick = () => { st.mapSec = null; drawMap(); drawMapTable(); };
  const steps = [-1, -.66, -.33, 0, .33, .66, 1];
  $("#mscale").innerHTML = `<span class="num">${by === "frg5" ? "순매도" : pct(-MAX, 0)}</span><span class="g">${steps.map(t => `<i style="background:${fill(t * MAX)}"></i>`).join("")}</span><span class="num">${by === "frg5" ? "순매수" : pct(MAX, 0)}</span>`;
}

function drawPicks() {
  const R = S.rec, P = R.picks.filter(p => st.aiSrc === "all" || p.src.includes(st.aiSrc)), el = $("#apicks");

  const mx = Math.max(...P.map(p => p.exp), 0.01);
  const rr = p => { const a = p.target / p.close - 1, b = 1 - p.stop / p.close; return b > 0 ? a / b : null; };
  const why = p => p.why.slice(0, 2).map(w => `<span class="chip" title="${esc(w[1])}">${esc(w[0])}</span>`).join("");

      <td><div class="prob num"><span class="bar" style="width:80px"><i style="width:${Math.max(p.exp, 0) / mx * 100}%"></i></span><b class="up">${pct(p.exp)}</b></div></td>
      <td class="num">${p1(p.prob)}%</td>

    ${H.length ? `<section class="kpis">

      <div class="kpi"><div class="k">오늘 손익</div><div class="v num ${cls(day)}">${(day > 0 ? "+" : "") + won(day)}</div><div class="s num">${val ? pct(day / (val - day) * 100) : "-"}</div></div>

    </section>
    <div class="g2 w mt">
      ${cardF("보유 종목", "", H.length ? `<div class="scroll"><table class="tbl"><thead><tr><th class="l">종목</th><th>수량</th><th>평균단가</th><th>현재가</th><th>평가금액</th><th>손익</th><th>비중</th><th></th></tr></thead><tbody>
        ${H.map((h, i) => `<tr data-go="${h.code}"><td class="l">${nameCell(h.s, S.pick[h.code] ? `<span style="color:var(--accent);font-weight:600">추천 ${S.pick[h.code].rank}위 · 기대 ${pct(S.pick[h.code].exp)}</span>` : esc(h.s.sector))}</td>
          <td class="num">${n(h.qty, 0)}</td><td class="num">${n(h.avg)}</td><td class="num two"><b>${n(h.s.price)}</b><small class="${cls(h.s.pct)}">${pct(h.s.pct)}</small></td>
          <td class="num">${n(h.v, 0)}</td><td class="num two ${cls(h.v - h.b)}"><b>${sg(h.v - h.b, 0)}</b><small>${pct(h.b ? (h.v / h.b - 1) * 100 : 0)}</small></td>
          <td class="num">${val ? p1(h.v / val * 100) + "%" : "-"}</td><td><button class="btn sm" data-stop data-pdel="${i}" type="button">삭제</button></td></tr>`).join("")}</tbody></table></div>`

    ${addCard}
    ${H.length ? "" : `<p class="note mt">추가하면 평가금액·손익·업종 비중·1년 평가금액 추이와 함께, 보유 종목이 AI 추천에 들어 있는지도 보여 줍니다.</p>`}`);

  const maps = D.map(d => d ? new Map(d.ohlcv.map(r => [r[0], r[4]])) : null), last = H.map(() => null);

  c.timeScale().fitContent();
};

        if (have.has(t[1])) mk.push({ time: t[1], position: "aboveBar", color: t[4] > 0 ? up : dn, shape: "circle", text: pct(t[4], 1) }); });
      cs.setMarkers(mk.sort((a, b) => a.time < b.time ? -1 : a.time > b.time ? 1 : 0));
    }
    if (pick) { cs.createPriceLine({ price: pick.target, color: up, lineWidth: 1, lineStyle: 2, title: "목표가" }); cs.createPriceLine({ price: pick.stop, color: dn, lineWidth: 1, lineStyle: 2, title: "손절가" }); }
    const all = [mc];
    subs.forEach(([k], i) => {
      const c = chartBase($("#p_" + k), { timeScale: { borderVisible: false, fixLeftEdge: true, fixRightEdge: true, visible: i === subs.length - 1 }, crosshair: { mode: 0, horzLine: { visible: false, labelVisible: false }, vertLine: { color: css("--line-strong"), labelVisible: false } } });
      const Ls = (a, color, w = 1.3, o = {}) => c.addLineSeries({ color, lineWidth: w, priceLineVisible: false, lastValueVisible: true, crosshairMarkerVisible: false, ...o }).setData(serOf(X, a));
      const hl = (s2, v2, color) => s2.createPriceLine({ price: v2, color, lineWidth: 1, lineStyle: 2, axisLabelVisible: false });
      const ink = css("--ink-2"), org = "#E08A00";
      const base = (a, h1, h2) => { const s2 = c.addLineSeries({ color: ink, lineWidth: 1.3, priceLineVisible: false }); s2.setData(serOf(X, a)); if (h1 != null) { hl(s2, h1, up); hl(s2, h2, dn); } return s2; };
      if (k === "vol") { const h = c.addHistogramSeries({ priceFormat: { type: "volume" }, priceLineVisible: false, lastValueVisible: false });
        h.setData(O.map(r => ({ time: r[0], value: r[5], color: (r[4] >= r[1] ? up : dn) + "80" }))); Ls(X.vma, css("--muted"), 1, { lastValueVisible: false }); }
      if (k === "rsi") base(X.rsi, 70, 30);
      if (k === "macd") { c.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false }).setData(X.t.map((t, i2) => X.hist[i2] == null ? { time: t } : { time: t, value: X.hist[i2], color: (X.hist[i2] >= 0 ? up : dn) + "70" })); Ls(X.macd, ink); Ls(X.sig, org); }
      if (k === "sto") { base(X.stoK, 80, 20); Ls(X.stoD, org); }
      if (k === "obv") Ls(X.obv, ink);
      if (k === "dmi") { Ls(X.pdi, up, 1.2); Ls(X.mdi, dn, 1.2); Ls(X.adx, ink, 1.5); }
      if (k === "cci") base(X.cci, 100, -100);
      if (k === "mfi") base(X.mfi, 80, 20);
      if (k === "wr") base(X.wr, -20, -80);
      all.push(c);
    });
    let lock = false;
    all.forEach(c => c.timeScale().subscribeVisibleLogicalRangeChange(r => { if (lock || !r) return; lock = true; all.forEach(o => o !== c && o.timeScale().setVisibleLogicalRange(r)); lock = false; }));
    const N = O.length; mc.timeScale().setVisibleLogicalRange({ from: Math.max(0, N - st.sPer), to: N + 1 });
    drawFlow();
  };
  const drawFlow = () => {
    const el = $("#sfbox");
    if (!F) { el.innerHTML = `<div class="empty">시가총액 3,000억 원 이상 종목만 투자자 동향을 제공합니다.</div>`; return; }
    el.innerHTML = `<div id="sfc"></div><div class="chart" id="sfch" style="height:210px;margin-top:10px"></div>${invLegend(cum ? INV : INV.slice(0, 3))}`;
    flowCards(F, $("#sfc")); flowChart($("#sfch"), F, 999, cum);
  };
  onSeg(v, "sp", x => { st.sPer = +x; draw(); });
  onSeg(v, "sc", x => { cum = x === "1"; draw(); });
  draw();
  const t = d.tech;
  $("#tbox").innerHTML = t ? `<div class="kv2 num" style="gap:12px 20px;font-size:13.5px">
      <div><span>추세 판정</span><b>${t.trend} <span class="flat" style="font-weight:400">${t.score > 0 ? "+" : ""}${t.score}</span></b></div><div><span>이동평균 배열</span><b>${t.align}</b></div>
      <div><span>RSI(14)</span><b>${n(t.rsi, 0)}${t.rsi >= 70 ? ` <span class="flat" style="font-weight:400">과열</span>` : t.rsi <= 30 ? ` <span class="flat" style="font-weight:400">침체</span>` : ""}</b></div><div><span>일평균 변동폭</span><b>${n(t.atr, 1)}%</b></div>
      <div><span>연초 대비</span><b class="${cls(t.ret.YTD)}">${pct(t.ret.YTD, 1)}</b></div><div><span>MACD</span><b>${X.hist.at(-1) > 0 ? "시그널 위" : "시그널 아래"}</b></div>
      <div><span>볼린저 위치</span><b>${X.bbU.at(-1) != null ? p1((C.at(-1) - X.bbL.at(-1)) / ((X.bbU.at(-1) - X.bbL.at(-1)) || 1) * 100) + "%" : "-"}</b></div><div><span>ADX</span><b>${X.adx.at(-1) != null ? n(X.adx.at(-1), 0) : "-"}</b></div></div>
    <div style="margin-top:14px"><div class="lbl" style="margin-bottom:8px">최근 신호</div>
      ${t.signals.length ? `<div class="chips">${t.signals.map(x => `<span class="chip" title="${esc(x[1])}">${esc(x[0])}</span>`).join("")}</div>` : `<span class="flat">특이 신호 없음</span>`}</div>
    <p class="note" style="margin-top:12px">볼린저 위치 0% = 하단 밴드, 100% = 상단 밴드. ADX 25 이상이면 추세가 강한 구간입니다.</p>` : `<div class="empty">-</div>`;
}

boot();
</script>
