<title>Wake</title>
<meta name="description" content="Wake — 큰돈의 흐름을 읽다. 외국인·기관·연기금 매매동향과 데이터 기반 1개월 상승 확률 추천">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단바 + (데스크톱) 좌측 고정 사이드바 | 본문, (모바일) 단일 컬럼 + 하단 탭바. 숫자 중심 타이포그래피 */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --sunk:#EEF0F3; --line:#E3E6EB; --line-strong:#CDD2DA;
  --ink:#111827; --ink-2:#3A4352; --muted:#727B8A; --accent:#1C2B4D; --accent-ink:#FFFFFF;
  --up:#E8202F; --down:#1660E8;
  --c-ind:#9AA3B2; --c-frg:#D9822B; --c-ins:#1C2B4D; --c-pen:#1F9D61;
  --font:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --r:10px; --gutter:20px; --maxw:1320px; --side:292px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0F16; --surface:#121824; --sunk:#192030; --line:#222A39; --line-strong:#323C4E;
  --ink:#E9EDF3; --ink-2:#BAC2CF; --muted:#8A93A3; --accent:#A3B6E2; --accent-ink:#0B0F16;
  --up:#FF4A57; --down:#4C8DFF;
  --c-ind:#7F8899; --c-frg:#F0A04B; --c-ins:#A3B6E2; --c-pen:#3FC283; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F16; --surface:#121824; --sunk:#192030; --line:#222A39; --line-strong:#323C4E;
  --ink:#E9EDF3; --ink-2:#BAC2CF; --muted:#8A93A3; --accent:#A3B6E2; --accent-ink:#0B0F16;
  --up:#FF4A57; --down:#4C8DFF;
  --c-ind:#7F8899; --c-frg:#F0A04B; --c-ins:#A3B6E2; --c-pen:#3FC283; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}

/* 상단바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter);height:58px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.brand .wm{font-weight:700;font-size:19px;letter-spacing:-.3px}
.brand small{font-size:11.5px;color:var(--muted)}
.nav{display:flex;gap:2px}
.nav a{padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap}
.nav a[aria-current="page"]{color:var(--ink);background:var(--sunk);font-weight:600}
.search{margin-left:auto;position:relative;flex:0 1 320px;min-width:0}
.search input{width:100%;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit}
.search input::placeholder{color:var(--muted)}
.sr{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:min(440px,62vh);overflow:auto;padding:4px}
.sr button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:7px;text-align:left}
.sr button:hover,.sr button.on{background:var(--sunk)}
.sr .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .n small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px}
.sr .p{font-size:12.5px;text-align:right}

/* 셸 */
.shell{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter);display:grid;grid-template-columns:var(--side) minmax(0,1fr);gap:22px;padding-block:20px 110px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 96px);overflow:auto;scrollbar-width:thin}
main{min-width:0}
.banner{font-size:12.5px;color:var(--ink-2);background:var(--sunk);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:11px;flex-wrap:wrap}
.sec-h h2{font-size:18px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:12.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px 18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.2px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:5px 10px;border-radius:7px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{color:var(--muted);font-size:13px;font-weight:500}
.link:hover{color:var(--ink)}

/* 사이드바 블록 */
.sb{padding:14px 14px 8px}
.sb h3{font-size:14px;letter-spacing:-.2px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sb h3 a{font-size:12px;font-weight:500;color:var(--muted)}
.sb .controls{margin:10px 0 4px}
.mini{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.mini:last-child{border-bottom:0}
.mini:hover{background:var(--sunk)}
.mini .rk{color:var(--muted);font-size:11.5px;text-align:right}
.mini .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .nm small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.mini .v{font-weight:700;font-size:13px;text-align:right}
.mini .v small{display:block;font-weight:500;font-size:11px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi .v{font-size:20px;font-weight:700;letter-spacing:-.4px}

/* 지수 */
.idx{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.idx .panel{padding:12px 14px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.idx .n{font-size:12.5px;color:var(--ink-2);font-weight:600}
.idx .v{font-size:20px;font-weight:700;letter-spacing:-.5px}
.idx .c{font-size:12px;font-weight:600}
.idx svg{width:100%;height:30px;margin-top:4px;display:block}

/* 수급 */
.flowrow{display:grid;grid-template-columns:62px minmax(0,1fr) 92px;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.flowrow:last-child{border-bottom:0}
.flowrow .who{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.div-bar{position:relative;height:22px}
.div-bar .axis{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line-strong)}
.div-bar .b{position:absolute;top:4px;bottom:4px;border-radius:3px}
.flowrow .val{text-align:right;font-weight:700;font-size:15px}
.flowrow .sub2{grid-column:2/4;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;color:var(--muted);margin-top:-6px}
.flowrow .sub2 span{white-space:nowrap}
.chart{height:280px;width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* 등락 분포 */
.breadth{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:10px 0 8px;background:var(--sunk)}
.bbar i{display:block;height:100%}
.bmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px}

/* 목록 */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row .rk{color:var(--muted);font-size:12.5px;text-align:right}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.row .px{text-align:right;font-weight:600}
.row .ch{text-align:right;font-weight:600;min-width:72px}
.row .bar{grid-column:2/5;height:3px;border-radius:2px;margin-top:-6px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:10px 0;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}

/* 종목 */
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sh .nm{font-size:25px;font-weight:700;letter-spacing:-.5px}
.sh .meta{color:var(--muted);font-size:13px}
.sh .px{font-size:40px;font-weight:700;letter-spacing:-1.2px;line-height:1.1}
.sh .ch{font-size:16px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line-strong);font-weight:600;font-size:13.5px;background:var(--surface)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.kv>div{padding:11px 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.kv>div:nth-child(4n){border-right:0}
.kv .k{font-size:12px;color:var(--muted)} .kv .v{font-weight:600;font-size:15px;margin-top:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.ind{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ind .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ind .grp b{font-size:12px;color:var(--muted);font-weight:500;min-width:44px}
.tog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;cursor:pointer;user-select:none;color:var(--muted);background:var(--surface)}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog .sw{width:9px;height:9px;border-radius:3px;border:1.5px solid currentColor;flex:none}
.tog:has(input:checked){color:var(--ink);border-color:var(--line-strong);font-weight:600}
.tog:has(input:checked) .sw{background:var(--c,var(--ink));border-color:var(--c,var(--ink))}
.pane{position:relative;border-top:1px solid var(--line)}
.pane .tag{position:absolute;left:8px;top:6px;z-index:3;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:0 4px;border-radius:4px;pointer-events:none}
.mainc{height:400px}
.subc{height:120px}

/* 추천 */
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat .panel{padding:14px 16px}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.6px;margin-top:2px}
.stat .s{font-size:12px;color:var(--muted)}
.rtable{width:100%;border-collapse:collapse}
.rtable th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.rtable td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
.rtable tr:last-child td{border-bottom:0}
.rtable tbody tr{cursor:pointer}
.rtable tbody tr:hover{background:var(--sunk)}
.rtable .l{text-align:left}
.rtable .nm{font-weight:700;font-size:14.5px}
.rtable .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.prob{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.prob b{font-size:17px;letter-spacing:-.3px;min-width:52px;text-align:right}
.track{position:relative;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;width:96px}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.track em{position:absolute;top:0;bottom:0;width:2px;background:var(--up)}
.lv b{display:block;font-size:14px}
.lv small{font-size:11.5px;font-weight:600}
.why{white-space:normal;max-width:300px}
.why .chips{justify-content:flex-start}
.cards{display:none}
.pick{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.pick .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pick .nm{font-weight:700;font-size:16px}
.pick .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.pick .px{text-align:right;font-weight:700;font-size:18px}
.pick .px small{display:block;font-size:12px;font-weight:600}
.lv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lv3 div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.lv3 .k{font-size:11px;color:var(--muted)} .lv3 .v{font-weight:700;font-size:15px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th{font-size:12px;color:var(--muted);font-weight:500}
table.t .l{text-align:left}
#trb td{white-space:nowrap}
.trw table{min-width:620px}
.scroll{overflow-x:auto}
.st{display:inline-block;font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;border:1px solid var(--line-strong);color:var(--ink-2)}
.st.win{border-color:transparent;background:var(--up);color:#fff}
.st.loss{border-color:transparent;background:var(--down);color:#fff}
.note{font-size:12.5px;color:var(--muted);line-height:1.75}
.note b{color:var(--ink-2)}
details.more{margin-top:12px}
details.more summary{cursor:pointer;color:var(--ink-2);font-weight:600;font-size:13.5px;padding:8px 0}
svg text{font-family:var(--font)}

/* 관심 */
.wl .row{grid-template-columns:minmax(0,1fr) auto auto 26px}
.x{color:var(--muted);font-size:18px;line-height:1}
.alert-on{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.form{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr)) auto;gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.form input,.form select{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font:inherit;min-width:0;width:100%}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sum .v{font-size:22px;font-weight:700;letter-spacing:-.4px}

footer{color:var(--muted);font-size:12px;margin-top:40px;line-height:1.7}
.skel{height:120px;border-radius:var(--r);background:var(--sunk)}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.wide-only{display:block}
.narrow-only{display:none}

.tabbar{display:none}
@media (max-width:1100px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .wide-only{display:none}
  .narrow-only{display:block}
}
@media (max-width:860px){
  :root{--gutter:16px}
  .nav{display:none}
  .top-in{gap:12px;height:54px}
  .brand small{display:none}
  .search{flex:1}
  .idx{grid-template-columns:repeat(2,minmax(0,1fr))}
  .idx .panel:first-child{grid-column:1/-1}
  .grid2,.breadth{grid-template-columns:minmax(0,1fr)}
  .stat{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv>div:nth-child(4n){border-right:1px solid var(--line)}
  .kv>div:nth-child(2n){border-right:0}
  .flowrow{grid-template-columns:52px minmax(0,1fr) 84px;gap:10px}
  .sh .px{font-size:34px}
  .form{grid-template-columns:1fr 1fr}
  .form label:first-child{grid-column:1/-1}
  .sum{grid-template-columns:1fr 1fr}
  .sum>div:first-child{grid-column:1/-1}
  .rwrap{display:none}
  .cards{display:grid;gap:10px}
  .mainc{height:320px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a{text-align:center;padding:12px 0 13px;font-size:13px;color:var(--muted);font-weight:500}
  .tabbar a[aria-current="page"]{color:var(--ink);font-weight:700}
}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .22s ease both}@keyframes f{from{opacity:.4}to{opacity:1}}}
</style>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const S = { list: [], by: {}, detail: {}, charts: [] };
const INV = ["외국인", "기관합계", "연기금", "개인"];
const INV_VAR = { "개인": "--c-ind", "외국인": "--c-frg", "기관합계": "--c-ins", "연기금": "--c-pen" };
const LBL = i => ({ "기관합계": "기관" }[i] || i);

/* ── 유틸 ── */
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function n(v, d) { if (v == null || isNaN(v)) return "-"; if (d == null) d = Math.abs(v) >= 1000 ? 0 : 2; return (+v).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d }); }
const sg = (v, d) => (v > 0 ? "+" : "") + n(v, d);
const p1 = v => v == null ? "-" : (+v).toFixed(1);
const pct = v => v == null ? "-" : `${v > 0 ? "+" : ""}${(+v).toFixed(2)}%`;
function eok(v, sign = true) {
  if (v == null || isNaN(v)) return "-";
  const a = Math.abs(v), p = sign && v > 0 ? "+" : v < 0 ? "-" : "";
  if (a >= 10000) return p + (a / 10000).toLocaleString("ko-KR", { maximumFractionDigits: 2 }) + "조";
  if (a < 10 && a > 0) return p + a.toLocaleString("ko-KR", { maximumFractionDigits: 1 }) + "억";
  return p + Math.round(a).toLocaleString("ko-KR") + "억";
}
const store = {
  get(k, d) { try { const v = localStorage.getItem("wk_" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wk_" + k, JSON.stringify(v)); } catch { } }
};
async function j(p) { const r = await fetch(p, { cache: "no-cache" }); if (!r.ok) throw new Error(p); return r.json(); }
function killCharts() { S.charts.forEach(c => { try { c.remove(); } catch { } }); S.charts = []; }
const mkName = m => m === "P" || m === "KOSPI" ? "코스피" : "코스닥";

/* 초성 검색 */
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const cho = s => [...s].map(ch => { const c = ch.charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch; }).join("");
const isCho = s => /^[ㄱ-ㅎ]+$/.test(s);

const EOK_LOC = { locale: "ko-KR", priceFormatter: v => eok(v), dateFormat: "yyyy.MM.dd" };
function chartBase(el, opt = {}) {
  const c = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { type: "solid", color: css("--surface") }, textColor: css("--muted"), fontFamily: css("--font"), fontSize: 11, attributionLogo: false },
    grid: { vertLines: { visible: false }, horzLines: { color: css("--line") } },
    rightPriceScale: { borderVisible: false, minimumWidth: 72 },
    timeScale: { borderVisible: false, fixLeftEdge: true, fixRightEdge: true },
    crosshair: { mode: 0, vertLine: { color: css("--line-strong"), labelBackgroundColor: css("--accent") }, horzLine: { color: css("--line-strong"), labelBackgroundColor: css("--accent") } },
    localization: { locale: "ko-KR", priceFormatter: v => n(v, Math.abs(v) >= 1000 ? 0 : 2), dateFormat: "yyyy.MM.dd" },
    handleScroll: { vertTouchDrag: false }, ...opt
  });
  S.charts.push(c);
  return c;
}
function spark(vals, up) {
  if (!vals || vals.length < 2) return "";
  const w = 200, h = 30, mn = Math.min(...vals), mx = Math.max(...vals), sp = mx - mn || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * w, h - 3 - (v - mn) / sp * (h - 6)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${w} ${h}L0 ${h}Z" fill="var(--ink)" opacity=".05"/>
    <path d="${d}" fill="none" stroke="var(--ink-2)" stroke-width="1.3" vector-effect="non-scaling-stroke" opacity=".7"/>
    <circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="2.6" fill="var(${up ? "--up" : "--down"})"/></svg>`;
}

/* ── 데이터 ── */
async function boot() {
  try {
    const f = ["meta", "market", "stocks", "rank", "ai", "rec", "track"];
    const r = await Promise.all(f.map(x => j(`data/${x}.json`).catch(() => null)));
    [S.meta, S.market, , S.rank, S.ai, S.rec, S.track] = r;
    const stocks = r[2];
    if (!S.meta || !stocks) throw new Error("data");
    S.list = stocks.rows.map(x => Object.fromEntries(stocks.fields.map((k, i) => [k, x[i]])));
    S.list.forEach(s => { S.by[s.code] = s; s.cho = cho(s.name); s.lname = s.name.toLowerCase(); });
    $("#asof").textContent = `${S.meta.asof.replaceAll("-", ".")} 기준`;
    drawSide();
    route();
  } catch (e) {
    $("#main").innerHTML = `<div class="panel empty">데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>`;
  }
}
const banner = () => S.meta?.demo ? `<div class="banner">미리보기용 가상 데이터입니다. 실제 서비스에서는 매일 장 마감 후 한국거래소 데이터로 갱신됩니다.</div>` : "";
const foot = () => `<footer>${S.meta ? `데이터 기준일 ${S.meta.asof} · 갱신 ${S.meta.updated} (한국시간)` : ""}<br>
  시세는 장 마감 기준이며 실시간이 아닙니다. 수급 단위는 억 원(순매수 = 매수 − 매도). 자료: 한국거래소, 네이버 금융.<br>
  확률은 과거 데이터에서 같은 점수대 종목이 실제로 수익을 낸 비율이며 미래 수익을 보장하지 않습니다. 투자 판단과 책임은 본인에게 있습니다.<br>
  차트: <a href="https://www.tradingview.com/lightweight-charts/" target="_blank" rel="noopener" style="text-decoration:underline">TradingView Lightweight Charts</a></footer>`;

/* ── 라우터 ── */
function route() {
  killCharts();
  const h = location.hash.slice(1) || "home";
  const [r, code] = h.split("-");
  $$("[data-r]").forEach(a => a.setAttribute("aria-current", a.dataset.r === r ? "page" : "false"));
  const m = $("#main");
  m.classList.remove("fade"); void m.offsetWidth; m.classList.add("fade");
  window.scrollTo(0, 0);
  document.title = "Wake";
  if (r === "stock" && code) return viewStock(code);
  ({ home: viewHome, flows: viewFlows, ai: viewAI, watch: viewWatch }[r] || viewHome)();
}
window.addEventListener("hashchange", route);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { drawSide(); route(); });
const goStock = c => location.hash = "stock-" + c;
function bindGo(root = document) { $$("[data-go]", root).forEach(b => b.onclick = e => { if (!e.target.closest("[data-del]")) goStock(b.dataset.go); }); }
function seg(name, opts, cur) {
  return `<div class="seg" role="group" data-seg="${name}">${opts.map(([v, l]) => `<button aria-pressed="${String(v) === String(cur)}" data-v="${v}">${l}</button>`).join("")}</div>`;
}
function onSeg(root, name, fn) {
  const g = $(`[data-seg="${name}"]`, root); if (!g) return;
  $$("button", g).forEach(b => b.onclick = () => { $$("button", g).forEach(x => x.setAttribute("aria-pressed", x === b)); fn(b.dataset.v); });
}
function stockRow(s, i, right) {
  return `<button class="row" data-go="${s.code}"><span class="rk num">${i ?? ""}</span>
    <span class="nm">${esc(s.name)}<small>${mkName(s.mkt)} · ${s.code}</small></span>
    <span class="px num">${n(s.price)}</span><span class="ch num ${cls(s.pct)}">${right ?? pct(s.pct)}</span></button>`;
}

    <section class="sec grid2">
      <div><div class="sec-h"><h2>오늘의 수급</h2>${seg("mk", [["KOSPI", "코스피"], ["KOSDAQ", "코스닥"]], st.mk)}</div><div class="panel pad" id="flowbox"></div></div>
      <div><div class="sec-h"><h2>누적 순매수</h2>${seg("fd", [[20, "1개월"], [60, "3개월"], [250, "1년"]], st.flowDays)}</div>

function flowCards(f, el) {
  if (!f) { el.innerHTML = `<div class="empty">수급 데이터가 없습니다.</div>`; return; }
  const last = INV.map(i => f[i].at(-1)), mx = Math.max(...last.map(Math.abs), 1);
  const sum = (i, k) => f[i].slice(-k).reduce((a, b) => a + (b || 0), 0);
  el.innerHTML = `<div class="lbl" style="margin-bottom:2px">${f.dates.at(-1).replaceAll("-", ".")} 하루 순매수</div>` + INV.map((i, k) => {
    const v = last[k], w = Math.abs(v) / mx * 50;
    return `<div class="flowrow"><span class="who"><i class="dot" style="background:var(${INV_VAR[i]})"></i>${LBL(i)}</span>
      <div class="div-bar"><span class="axis"></span><span class="b" style="${v >= 0 ? `left:50%;width:${w}%;background:var(--up)` : `right:50%;width:${w}%;background:var(--down)`}"></span></div>
      <span class="val num ${cls(v)}">${eok(v)}</span>
      <span class="sub2 num"><span>5일 <b class="${cls(sum(i, 5))}">${eok(sum(i, 5))}</b></span><span>20일 <b class="${cls(sum(i, 20))}">${eok(sum(i, 20))}</b></span>${streak(f[i])}</span></div>`;
  }).join("");
}
function streak(a) { let k = 0; for (let i = a.length - 1; i >= 0; i--) { const v = a[i]; if (!v || (k && (v > 0) !== (k > 0))) break; k += v > 0 ? 1 : -1; }
  return Math.abs(k) >= 2 ? `<span>${Math.abs(k)}일 연속 ${k > 0 ? "순매수" : "순매도"}</span>` : ""; }
function flowChart(el, f, days, cum = true) {
  const c = chartBase(el, { localization: EOK_LOC });
  const k = Math.min(days, f.dates.length);
  INV.forEach(i => {
    const o = { color: css(INV_VAR[i]), priceLineVisible: false, lastValueVisible: false, priceFormat: { type: "custom", formatter: v => eok(v) } };
    if (cum) { const s = c.addLineSeries({ ...o, lineWidth: i === "개인" ? 1.5 : 2 }); let a = 0;
      s.setData(f.dates.slice(-k).map((t, j) => ({ time: t, value: (a += f[i].slice(-k)[j] || 0) }))); }
    else if (i !== "개인") c.addHistogramSeries(o).setData(f.dates.slice(-k).map((t, j) => ({ time: t, value: f[i].slice(-k)[j] || 0 })));
  });
  c.timeScale().fitContent();
}
function drawHomeFlow() { killCharts(); const f = S.market?.flows?.[st.mk]; flowCards(f, $("#flowbox")); if (f) flowChart($("#fc"), f, st.flowDays); }
function drawRank() {
  const t = st.rankTab, key = { up: "pct", down: "pct", amt: "amt", cap: "cap" }[t];

  bindGo($("#rl"));
}

const DEF_WATCH = ["005930", "000660", "005380", "000270"];
function viewWatch() {
  const wl = store.get("watch", DEF_WATCH).filter(c => S.by[c]), al = store.get("alerts", {}), pf = store.get("pf", []).filter(p => S.by[p.code]);
  const hit = c => { const a = al[c], p = S.by[c].price; return a && ((a.above && p >= a.above) || (a.below && p <= a.below)); };
  const recOf = c => S.rec?.ok ? S.rec.picks.find(p => p.code === c) : null;
  const wrows = wl.map(c => { const s = S.by[c], r = recOf(c);
    return `<div class="row" style="cursor:pointer" data-go="${c}"><span class="nm">${esc(s.name)}${hit(c) ? `<span class="alert-on">알림 도달</span>` : ""}${r ? `<span class="alert-on" style="background:var(--c-pen)">추천 ${pct(r.exp)}</span>` : ""}
      <small>${c}${al[c] ? ` · 알림 ${al[c].above ? n(al[c].above) + " 이상" : ""}${al[c].above && al[c].below ? " / " : ""}${al[c].below ? n(al[c].below) + " 이하" : ""}` : ""}</small></span>
      <span class="px num">${n(s.price)}</span><span class="ch num ${cls(s.pct)}">${pct(s.pct)}</span><button class="x" data-del="${c}" aria-label="${esc(s.name)} 삭제">×</button></div>`; }).join("");
  let buy = 0, val = 0, day = 0;
  const prows = pf.map((p, i) => { const s = S.by[p.code], b = p.qty * p.avg, v = p.qty * s.price, dd = p.qty * s.chg; buy += b; val += v; day += dd;
    return `<tr><td class="l"><a href="#stock-${p.code}"><b>${esc(s.name)}</b></a></td><td class="num">${n(p.qty, 0)}</td><td class="num">${n(p.avg)}</td><td class="num ${cls(s.pct)}">${n(s.price)}</td>
      <td class="num">${n(v, 0)}</td><td class="num ${cls(v - b)}">${sg(v - b, 0)}</td><td class="num ${cls(v - b)}">${pct(b ? (v / b - 1) * 100 : 0)}</td><td><button class="x" data-pdel="${i}" aria-label="삭제">×</button></td></tr>`; }).join("");
  const opts = S.list.slice().sort((a, b) => a.name.localeCompare(b.name, "ko")).map(s => `<option value="${s.code}">${esc(s.name)}</option>`).join("");
  $("#main").innerHTML = `${banner()}
    <section class="grid2">
      <div><div class="sec-h"><h2>관심종목</h2><span class="sub">이 기기의 브라우저에 저장됩니다</span></div>
        <div class="panel pad wl"><div class="list">${wrows || `<div class="empty">위쪽 검색에서 종목을 찾아 관심 추가를 누르세요.</div>`}</div></div>
        <div class="panel pad" style="margin-top:12px"><div class="lbl" style="margin-bottom:8px">가격 알림 · 이 페이지를 열 때 도달 여부를 표시합니다</div>
          <form class="form" id="af"><label for="ac">종목<select id="ac">${wl.map(c => `<option value="${c}">${esc(S.by[c].name)}</option>`).join("")}</select></label>
            <label for="aa">이 가격 이상<input id="aa" type="number" inputmode="numeric" min="0"></label><label for="ab">이 가격 이하<input id="ab" type="number" inputmode="numeric" min="0"></label>
            <button class="btn pri" type="submit">저장</button></form></div></div>
      <div><div class="sec-h"><h2>보유종목</h2><span class="sub">종가 기준 평가</span></div>
        <div class="panel pad"><div class="sum num"><div><div class="lbl">총 평가금액</div><div class="v">${n(val, 0)}</div></div>
            <div><div class="lbl">평가손익</div><div class="v ${cls(val - buy)}">${sg(val - buy, 0)}</div><div class="num ${cls(val - buy)}" style="font-size:12.5px;font-weight:600">${pct(buy ? (val / buy - 1) * 100 : 0)}</div></div>
            <div><div class="lbl">오늘 손익</div><div class="v ${cls(day)}">${sg(day, 0)}</div></div></div>
          ${pf.length ? `<div class="scroll" style="margin-top:14px"><table class="t"><thead><tr><th class="l">종목</th><th>수량</th><th>평균단가</th><th>현재가</th><th>평가금액</th><th>손익</th><th>수익률</th><th></th></tr></thead><tbody>${prows}</tbody></table></div>` : ""}
          <form class="form" id="pff" style="margin-top:14px"><label for="pc2">종목<select id="pc2">${opts}</select></label>
            <label for="pq">수량<input id="pq" type="number" inputmode="numeric" min="1" required></label><label for="pa">평균단가<input id="pa" type="number" inputmode="numeric" min="1" required></label>
            <button class="btn pri" type="submit">추가</button></form></div></div></section>${foot()}`;
  const root = $("#main"); bindGo(root);
  $$("[data-del]", root).forEach(b => b.onclick = e => { e.stopPropagation(); store.set("watch", store.get("watch", DEF_WATCH).filter(x => x !== b.dataset.del)); viewWatch(); });
  $$("[data-pdel]", root).forEach(b => b.onclick = () => { const a = store.get("pf", []); a.splice(+b.dataset.pdel, 1); store.set("pf", a); viewWatch(); });
  $("#af").onsubmit = e => { e.preventDefault(); const c = $("#ac").value; if (!c) return; const a = store.get("alerts", {}); a[c] = { above: +$("#aa").value || 0, below: +$("#ab").value || 0 }; store.set("alerts", a); viewWatch(); };
  $("#pff").onsubmit = e => { e.preventDefault(); const a = store.get("pf", []); a.push({ code: $("#pc2").value, qty: +$("#pq").value, avg: +$("#pa").value }); store.set("pf", a); viewWatch(); };
}

(function () {
  const q = $("#q"), box = $("#sr"); let sel = 0, res = [];
  const draw = () => { box.innerHTML = res.map((s, i) => `<button class="${i === sel ? "on" : ""}" data-c="${s.code}"><span class="n">${esc(s.name)}<small>${mkName(s.mkt)}</small></span>
      <span class="p num">${n(s.price)} <span class="${cls(s.pct)}">${pct(s.pct)}</span></span></button>`).join("") || `<div class="empty">검색 결과가 없습니다.</div>`;
    $$("button", box).forEach(b => b.onmousedown = e => { e.preventDefault(); pick(b.dataset.c); }); };
  const pick = c => { q.value = ""; box.hidden = true; q.blur(); goStock(c); };
  q.addEventListener("input", () => {
    const t = q.value.trim().toLowerCase().replace(/\s/g, "");
    if (!t) { box.hidden = true; return; }
    const ch = isCho(t);
    res = S.list.map(s => { const nm = s.lname.replace(/\s/g, ""), cs = s.cho.replace(/\s/g, "");
        const sc = nm.startsWith(t) ? 3 : nm.includes(t) ? 2 : ch && cs.startsWith(t) ? 2.5 : ch && cs.includes(t) ? 1.5 : /^\d+$/.test(t) && s.code.startsWith(t) ? 1 : 0;
        return [sc, s]; }).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0] || b[1].cap - a[1].cap).slice(0, 12).map(x => x[1]);
    sel = 0; box.hidden = false; draw();
  });
  q.addEventListener("keydown", e => { if (box.hidden) return;
    if (e.key === "ArrowDown") { sel = Math.min(sel + 1, res.length - 1); draw(); e.preventDefault(); }
    if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
    if (e.key === "Enter" && res[sel]) pick(res[sel].code);
    if (e.key === "Escape") box.hidden = true; });
  q.addEventListener("blur", () => setTimeout(() => box.hidden = true, 120));
})();

boot();
</script>
